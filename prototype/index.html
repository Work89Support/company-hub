<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Company Hub — ระบบศูนย์รวมงานองค์กร (Prototype v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue-900:#0b2a6b; --blue-800:#123a86; --blue-700:#1a49a6; --blue-600:#2158c8;
  --blue-500:#2f6fe0; --blue-400:#5b8ff0; --blue-100:#e7effc; --blue-50:#f2f6fd;
  --primary:#2158c8; --primary-d:#123a86;
  --ink:#182338; --muted:#67769a; --line:#e4eaf3; --line-2:#eef2f9; --bg:#f4f7fc; --white:#ffffff; --surface:#ffffff;
  --gray:#b7c0d0; --green:#00a878; --amber:#e8971b; --red:#e2445c; --sky:#2f8fe6; --purple:#7a53e0;
  --radius:12px; --shadow:0 2px 10px rgba(20,58,134,.06); --shadow-lg:0 12px 40px rgba(20,58,134,.18);
}
body.dark{
  --bg:#0e1626; --white:#16213a; --surface:#16213a; --ink:#e8eef8; --muted:#93a1bf;
  --line:#28344f; --line-2:#1f2b44; --blue-50:#1b2942; --blue-100:#26385c;
  --blue-700:#9cc0ff; --blue-400:#3f74d8; --shadow:0 2px 10px rgba(0,0,0,.35); --shadow-lg:0 14px 40px rgba(0,0,0,.5);
}
body.dark .ai-note,body.dark .exec-summary{background:linear-gradient(120deg,#1b2942,#173430);border-color:#28344f}
body.dark .pin{background:linear-gradient(90deg,#1b2942,var(--surface))}
body.dark .stbtn.active{color:#fff}
body.dark .brandbar{filter:brightness(.9)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Kanit','Noto Sans Thai','Leelawadee UI','Sarabun',sans-serif;background:var(--bg);color:var(--ink);font-weight:300;font-size:13.5px;word-break:break-word;overflow-wrap:break-word;line-break:auto;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font-family:inherit;font-size:inherit}
.nowrap{white-space:nowrap}
td,.tile h4,.ann h4,.msg{word-break:break-word;overflow-wrap:break-word;line-break:auto}
button{cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cdd8ea;border-radius:8px}

/* Layout */
.app{display:grid;grid-template-columns:248px 1fr;grid-template-rows:58px 1fr;height:100vh;grid-template-areas:"logo top" "side main"}
.topbar{grid-area:top;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;z-index:20}
.brandbar{grid-area:logo;background:linear-gradient(160deg,var(--blue-800),var(--blue-600));display:flex;align-items:center;gap:10px;padding:0 18px;color:#fff}
.brandbar .logo{width:32px;height:32px;border-radius:9px;background:#fff;color:#123a86;display:grid;place-items:center;font-weight:700;font-size:17px}
.brandbar b{font-weight:600;font-size:15.5px;letter-spacing:.2px}
.brandbar span{font-size:10.5px;opacity:.8;display:block;font-weight:300;margin-top:-3px}
.sidebar{grid-area:side;background:linear-gradient(180deg,var(--blue-800),var(--blue-900));color:#dfe8fb;padding:12px 12px;overflow-y:auto}
.main{grid-area:main;overflow-y:auto;padding:18px 24px 60px}

/* Topbar */
.search{flex:1;max-width:380px;position:relative}
.search input{width:100%;padding:8px 14px 8px 36px;border:1px solid var(--line);border-radius:9px;background:var(--blue-50);font-size:13px}
.search::before{content:"🔍";position:absolute;left:11px;top:7px;opacity:.5;font-size:12px}
.roleswitch{display:flex;background:var(--blue-50);border:1px solid var(--line);border-radius:9px;padding:3px}
.roleswitch button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:12px;color:var(--muted);font-weight:400}
.roleswitch button.active{background:var(--primary);color:#fff}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:12.5px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{border-color:var(--blue-400)}
.tbtn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.tbtn.sm{padding:5px 9px;font-size:11.5px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue-600);color:#fff;display:grid;place-items:center;font-weight:500;font-size:13px}

/* Sidebar */
.side-user{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;background:rgba(255,255,255,.08);margin-bottom:12px}
.side-user .avatar{background:#fff;color:#123a86}
.side-user small{display:block;opacity:.7;font-size:10.5px}
.navgroup{font-size:10px;text-transform:uppercase;letter-spacing:.8px;opacity:.5;margin:12px 10px 5px}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:#dfe8fb;font-size:13px;font-weight:300;margin-bottom:2px;border:0;background:transparent;width:100%;text-align:left}
.navitem:hover{background:rgba(255,255,255,.09)}
.navitem.active{background:var(--primary);color:#fff;font-weight:400}
.navitem .ic{width:19px;text-align:center;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.navitem .ic .svic{width:18px;height:18px;stroke-width:1.7}
.navitem .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 7px;border-radius:20px}

/* Header + breadcrumb */
.crumb{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.crumb b{color:var(--blue-700);font-weight:500}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.page-h h1{font-size:22px;font-weight:600}
.page-h p{color:var(--muted);font-size:12.5px;font-weight:300;margin-top:2px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.card-h h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-h .act{font-size:11.5px;color:var(--muted)}
.pad{padding:16px}
.grid{display:grid;gap:14px}
.hide{display:none!important}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;color:#fff;font-weight:400;white-space:nowrap}
.tag{display:inline-block;padding:2px 9px;border-radius:6px;background:var(--blue-100);color:var(--blue-700);font-size:10.5px;margin:2px 3px 2px 0;font-weight:400}
.muted{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative}
.stat .lbl{color:var(--muted);font-size:11.5px}
.stat .val{font-size:26px;font-weight:600;margin-top:3px;letter-spacing:-.5px}
.stat .sub{font-size:11px;margin-top:2px}
.stat .icn{position:absolute;right:13px;top:13px;font-size:19px;opacity:.22}
.stat .icn .svic{width:26px;height:26px;stroke-width:1.6}
/* ===== SVG line-icon system (monochrome, inherits color) ===== */
.svic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3.5px;flex:0 0 auto}
.card-h h3 .svic{width:17px;height:17px;color:var(--accent)}
.sect-title .svic{width:16px;height:16px;vertical-align:-3px;color:var(--accent)}
.tbtn .svic{width:15px;height:15px;vertical-align:-2.5px}
.up{color:var(--green)} .down{color:var(--red)}
.stat.accent{background:linear-gradient(150deg,var(--blue-700),var(--blue-500));color:#fff;border:0}
.stat.accent .lbl,.stat.accent .sub{color:rgba(255,255,255,.85)}
.stat.click{cursor:pointer;transition:.12s}
.stat.click:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--blue-400)}
.stat.accent.click:hover{filter:brightness(1.06)}
.stat .go{position:absolute;right:12px;bottom:9px;font-size:10.5px;color:var(--blue-600);opacity:0;transition:.12s;font-weight:400}
.stat.accent .go{color:#fff}
.stat.click:hover .go{opacity:.95}
.hlink{cursor:pointer}
.hlink:hover{background:var(--blue-50);border-radius:6px}
.legrow{cursor:pointer;border-radius:7px;padding:3px 6px!important}
.legrow:hover{background:var(--blue-50)}

/* Bars & KPI rows */
.bar{height:8px;background:var(--blue-50);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px}
.kpirow{display:grid;grid-template-columns:170px 1fr 78px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line-2)}
.kpirow:last-child{border-bottom:0}
.kpirow .nm{font-size:12.5px} .kpirow .nm small{display:block;color:var(--muted);font-size:10.5px}
.score{font-weight:600;text-align:right;font-size:13px}
/* KPI item อ่านง่าย */
.kpi-item{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line-2)}
.kpi-item:last-child{border-bottom:0}
.kpi-icn{width:28px;height:28px;border-radius:9px;color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0}
.kpi-name{font-size:13px;font-weight:500;line-height:1.35}
.kpi-val{font-size:12px}
.kpi-val b{font-size:14px}
.kpi-edit{margin-top:6px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi-edit input{width:66px;padding:4px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:600;text-align:right}
.kpi-edit input:focus{outline:2px solid var(--accent);border-color:var(--accent)}

/* Horizontal magnitude bars (charts) */
.hbar{display:grid;grid-template-columns:130px 1fr 46px;gap:10px;align-items:center;padding:5px 0;font-size:12px}
.hbar .track{height:20px;background:var(--blue-50);border-radius:5px;overflow:hidden}
.hbar .track>i{display:block;height:100%;background:var(--primary);border-radius:5px;min-width:3px}
.hbar .num{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:11.5px;margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Filter toolbar */
.filterbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow);margin-bottom:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.filterbar .fsearch{position:relative;flex:1;min-width:180px}
.filterbar .fsearch input{width:100%;padding:7px 12px 7px 30px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:var(--blue-50)}
.filterbar .fsearch::before{content:"🔍";position:absolute;left:10px;top:6px;opacity:.45;font-size:11px}
.fsel{display:flex;align-items:center;gap:5px;font-size:12px}
.fsel select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:12px;background:var(--surface);color:var(--ink)}
.fsel label{color:var(--muted);font-size:11px}
.fdiv{width:1px;height:24px;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-100);color:var(--blue-700);padding:4px 10px;border-radius:20px;font-size:11.5px;border:0}
.fchip b{font-weight:500}
.fchip .rm{cursor:pointer;opacity:.6;font-weight:600}
.fchip .rm:hover{opacity:1}
.resultline{font-size:11.5px;color:var(--muted);margin:2px 0 10px}

/* Table (Monday board) */
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.board-grp{padding:11px 15px 5px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:10.5px;color:var(--muted);font-weight:500;padding:8px 12px;background:var(--blue-50);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px;cursor:pointer;user-select:none}
thead th:hover{color:var(--blue-700)}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line-2);font-size:12.5px;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--blue-50)}
.trow-lead{border-left:3px solid var(--red)}
.people{display:flex;align-items:center;gap:6px}
.mini{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;color:#fff;font-weight:500;flex-shrink:0}
tfoot td{padding:9px 12px;font-size:11.5px;font-weight:500;background:var(--blue-50);border-top:1px solid var(--line);color:var(--muted)}

/* Timeline */
.tl-help{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:12px}
.tl-wrap{overflow-x:auto;padding-bottom:6px}.tl-canvas{min-width:980px}
.tl-row{display:grid;grid-template-columns:300px minmax(660px,1fr);gap:12px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line-2)}
.tl-row:last-child{border-bottom:0}.tl-label{min-width:0;cursor:pointer}
.tl-title{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-meta{font-size:10.5px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:3px;white-space:nowrap;overflow:hidden}
.tl-track{position:relative;height:28px;background:repeating-linear-gradient(90deg,var(--blue-50) 0,var(--blue-50) calc(8.333% - 1px),var(--line-2) calc(8.333% - 1px),var(--line-2) 8.333%);border-radius:7px}
.tl-bar{position:absolute;height:28px;border-radius:7px;color:#fff;font-size:10.5px;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden;min-width:3px;cursor:pointer;box-shadow:0 2px 5px #163d7a22}
.tl-scale{margin-left:312px;display:flex;justify-content:space-between;font-size:10px;color:var(--muted);border-bottom:1px solid var(--line);padding:0 2px 6px;margin-bottom:2px}
.tl-today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--red);z-index:2;pointer-events:none}
.tl-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:9px;margin-top:12px}
.tl-item{border:1px solid var(--line);border-left:4px solid var(--blue-500);border-radius:9px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.tl-item:hover{background:var(--blue-50)}
@media(max-width:760px){.tl-row{grid-template-columns:220px minmax(620px,1fr)}.tl-scale{margin-left:232px}}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--blue-400)}
.tile h4{font-size:14px;font-weight:600;margin-bottom:5px}
.tile .meta{font-size:11px;color:var(--muted)}

/* Announcements / feed */
.ann{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.ann:last-child{border:0}
.ann .who{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:600;flex-shrink:0}
.ann h4{font-size:13.5px;font-weight:600}
.ann .body{font-size:12.5px;color:#43506e;margin-top:3px;font-weight:300}
.ann .time{font-size:10.5px;color:var(--muted);margin-top:4px}
.pin{background:linear-gradient(90deg,var(--blue-50),#fff);border-left:3px solid var(--amber);padding-left:12px}
.feed-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line-2);font-size:12.5px}
.feed-item .fi{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;font-size:13px}

/* Reports */
.rep-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.seg{display:inline-flex;background:var(--blue-50);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:7px;font-size:12px;color:var(--muted);font-weight:400}
.seg button.active{background:var(--primary);color:#fff}
.exec-summary{background:linear-gradient(120deg,#f2f6fd,#eef7f3);border:1px solid var(--blue-100);border-radius:var(--radius);padding:16px 18px;font-size:13px;line-height:1.75;font-weight:300}
/* Monthly report form */
.rpt{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:26px 30px;max-width:920px;margin:0 auto}
.rpt h2{font-size:18px;text-align:center;font-weight:600}
.rpt .rsub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:14px}
.rpt h3{font-size:14px;font-weight:600;margin:18px 0 8px;border-left:4px solid var(--primary);padding-left:9px}
.rpt table{width:100%;border-collapse:collapse;margin-top:4px}
.rpt th,.rpt td{border:1px solid var(--line);padding:6px 9px;font-size:12px;text-align:left;vertical-align:top}
.rpt th{background:var(--blue-50);font-weight:500}
.rpt .rmeta{display:grid;grid-template-columns:1fr 1fr;gap:5px 24px;font-size:12.5px;margin:6px 0 4px}
.rpt .rmeta b{font-weight:500}
.gyr{display:inline-block;padding:1px 8px;border-radius:20px;color:#fff;font-size:11px;font-weight:500}
.rbox{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;margin:4px 0;background:var(--blue-50)}
.exec-summary b{color:var(--blue-800);font-weight:500}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}

/* Chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:420px}
.chat-body{flex:1;overflow-y:auto;padding:6px 4px}
.msg{max-width:76%;padding:10px 14px;border-radius:13px;margin:7px 0;font-size:13px;line-height:1.55;font-weight:300}
.msg.u{background:var(--primary);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.a{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a .q{font-family:monospace;font-size:11px;background:var(--blue-50);padding:6px 9px;border-radius:8px;color:var(--blue-800);margin:6px 0;display:block}
.chip{display:inline-block;background:var(--blue-50);border:1px solid var(--line);color:var(--blue-700);padding:6px 11px;border-radius:20px;font-size:12px;margin:4px 6px 0 0;cursor:pointer}
.chip:hover{background:var(--blue-100)}
.chat-in{display:flex;gap:10px;margin-top:10px}
.chat-in input{flex:1;padding:11px 15px;border:1px solid var(--line);border-radius:11px;font-size:13.5px}
.talk-fab{position:fixed;right:22px;bottom:22px;z-index:45;border:0;border-radius:999px;padding:12px 17px;background:linear-gradient(135deg,var(--blue-700),var(--blue-500));color:#fff;box-shadow:0 10px 28px rgba(25,91,190,.35);display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.talk-fab:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(25,91,190,.42)}
.talk-fab .svic{width:19px;height:19px}
.modal:has(.talk-popup){max-width:760px}
.talk-popup .chat{height:min(610px,72vh);min-height:430px}.talk-popup .chat-body{background:var(--blue-50);border-radius:12px;padding:12px}
.problem-insights{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:14px;margin-bottom:14px}
.insight-row{padding:9px 0;border-bottom:1px dashed var(--line-2)}.insight-row:last-child{border-bottom:0}
.insight-row .head{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:5px}.insight-row .head b{font-weight:500}
.flowline{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:14px 0}
.flowstep{position:relative;background:var(--surface);border:1px solid var(--line);padding:13px 14px;min-height:70px}.flowstep:first-child{border-radius:12px 0 0 12px}.flowstep:last-child{border-radius:0 12px 12px 0}

/* ===== KPI: คำนวณ Achievement จาก Actual/Target แล้วเก็บใน k.pct ===== */

/* คะแนนรวมแผนก 0–100: มีน้ำหนัก → ถ่วงน้ำหนัก (Achievement เกิน 100 นับที่ 100) ; ไม่มีน้ำหนัก → เฉลี่ยเท่ากัน */

  if(a.every(k=>k.w!=null)){const total=a.reduce((s,k)=>s+Math.min(k.pct,100*(k.metadata?.achievement_cap||1))*k.w,0);return code==='PROG'?Math.round(total*100)/100:Math.round(total);}
  return Math.round(a.reduce((s,k)=>s+Math.min(k.pct,100),0)/a.length); };

  {id:"SOP-FIN",dept:"FIN",title:"Workflow การเงิน",v:"1.0",goal:"ทำให้ขั้นตอนงานการเงินชัดเจน ตรวจสอบง่าย ลดความผิดพลาดจากการลงข้อมูลด้วยมือ",duties:["รับ/ส่งรายการเบิกจ่ายใน Telegram พร้อมหลักฐาน", "พิจารณาอนุมัติยอดเบิกตามขอบเขตอำนาจ + โอนจ่ายและแนบสลิป", "จัดทำเงินสำรองเบิก + รายละเอียดแยกหมวดหมู่", "บันทึกกระแสเงินสด + สรุปเดือน (กำไร/ขาดทุน) + ตรวจบิลค่าระบบ", "วิเคราะห์ข้อมูลย้อนหลัง 3 เดือนร่วมกับทีมบริหารแอดมิน"],steps:["ผู้ขอเบิกส่งรายการ + หลักฐานใน Telegram", "ผู้มีอำนาจพิจารณาความสมเหตุสมผลและอนุมัติ", "การเงินตรวจยอด / ผู้รับ / ช่องทาง / สกุลเงินก่อนโอน", "ทำรายการโอนจ่าย + แนบสลิปในกลุ่ม", "Bot ดึงข้อมูลจากกลุ่มเข้า Google Sheet", "ตรวจข้อมูลใน Sheet ให้ครบและตรงหลักฐาน", "สรุปเดือน: ลงกระแสเงินสด → รวมค่าใช้จ่าย → คำนวณกำไร/ขาดทุน → กระทบยอด (ไม่ตรงห้ามสรุป)", "ติดตามบิลค่าระบบ + วิเคราะห์ย้อนหลัง 3 เดือน"],tools:["Telegram", "Bot ดึงข้อมูล Telegram → Google Sheet", "Google Sheet", "Back office: BO / Agent", "ChatGPT (ช่วยวิเคราะห์ ไม่ใช่ผู้อนุมัติ)"],issues:["ดึงข้อมูลจาก BO/Agent ด้วยมือ อาจสลับยอด → ตรวจเทียบ Source ก่อนบันทึก ใช้ Automation", "ลงกระแสเงินสดไม่ตรงกระเป๋า → ตรวจ Wallet/บัญชีต้นทาง-ปลายทาง Reconcile ทุกวัน", "สรุปเดือนไม่ตรง → หารายการที่หาย/บันทึกผิด ก่อนปิดเดือน"],ai:["บันทึกรายการเบิกจ่ายอัตโนมัติจาก Telegram", "ดึงข้อมูล BO/Agent เข้าตารางสรุปเดือน", "แจ้งเตือนรายการไม่ครบ / ยอดไม่ตรง / บิลใกล้ครบกำหนด", "ช่วยจัดทำสรุปเดือน + เปรียบเทียบย้อนหลัง", "⚠️ คนอนุมัติ: การอนุมัติยอดเบิก, การโอน USDT/USD/เงินสด, การตีความผลสรุปเดือน"]},
  {id:"SOP-QC",dept:"QC",title:"Workflow QC Chat",v:"1.0",goal:"ตรวจคุณภาพการตอบแชทของแอดมินให้ได้มาตรฐาน ลดการตอบล่าช้า / ไม่ตรงคำถาม / ปิดเคสไม่สมบูรณ์",duties:["ตรวจคุณภาพการให้บริการแชทของแอดมินทั้ง 9 เว็บ", "ตรวจการตอบล่าช้า ตอบไม่ตรงคำถาม และการปิดการสนทนา", "บันทึกผลและอัปเดตข้อมูลลง Google Sheets"],steps:["ตรวจสอบแชท: ตรวจทั้ง 9 เว็บ ตั้งแต่ 00.00 น. ถึงปัจจุบัน เน้นตอบช้า / ไม่ตรง / ปิดเคสไม่สมบูรณ์", "บันทึกจุดตรวจ: บันทึกจำนวนแชทและเวลาที่ตรวจไว้เพื่อใช้รอบถัดไป", "พบตอบช้า: สอบถามสาเหตุในกลุ่ม + ระบุผู้รับผิดชอบตามกะ", "รับคำชี้แจง: ตรวจความสมเหตุสมผลของสาเหตุ", "บันทึกผล: ลงชีตรายละเอียดการตอบแชทล่าช้าตามหลักเกณฑ์บริษัท"],tools:["Google Sheets (บันทึกผลตรวจ)", "LINE Official (ตรวจสอบแชท)"],issues:["ตรวจแชทไม่ครบช่วงเวลา → ใช้ Checklist ก่อนปิดรอบ QC", "บันทึกจำนวน/เวลาผิด, ลงชีตผิดช่อง/ผิดวัน → ตรวจซ้ำก่อนปิดรอบ", "ประสานงานแอดมินไม่ครบ ทำให้คำชี้แจงล่าช้า → ติดตามให้ครบ"],ai:["ตรวจจับตอบช้า + แจ้งเตือนเมื่อเกินเกณฑ์", "วิเคราะห์คุณภาพคำตอบ (ตรงคำถาม / ครบ / ปิดสนทนา)", "บันทึกผลอัตโนมัติ + สรุปสถิติรายวัน/สัปดาห์/เดือน", "Dashboard แสดงแนวโน้มปัญหาแบบเรียลไทม์", "⚠️ คนตัดสินใจ: สรุปสาเหตุ, กรณีซับซ้อน, ความสมเหตุสมผลของคำชี้แจง"]},

  {id:"SOP-HR",dept:"HR",title:"Workflow ทรัพยากรบุคคล (HR)",v:"1.0",goal:"ตรวจ → เทียบ → ยืนยัน → ดำเนินการ | ข้อมูลไม่ตรง/ไม่แน่ใจ ให้หยุดตรวจสอบก่อน",duties:["รับสมัคร / คัดกรอง / สัมภาษณ์ / จ้างงาน", "ดูแลค่าตอบแทน: เงินเดือน / สวัสดิการ / วันลา / เงินปันผล", "สื่อสารภายในองค์กร (ประกาศ)", "ประเมินผลพนักงาน (Performance)", "ดูแล/พัฒนาการใช้งานระบบ OMBOG"],steps:["รับสมัคร: ทำประกาศ → รับข้อมูล → คัดกรองเบื้องต้น", "สัมภาษณ์: ผู้ผ่านเกณฑ์สัมภาษณ์โทรศัพท์ ~40–60 นาที + บันทึกผล", "เก็บประวัติ: ตรวจข้อมูล → จัดทำประวัติ → เก็บใน Google Drive", "ค่าตอบแทน: รับสรุปจากหัวหน้าทีม → เทียบ OMBOG → ตรวจเงินเดือน/วันลา/สวัสดิการ → ยืนยันก่อนจ่าย", "ประกาศ: ตรวจข้อเท็จจริง → เรียบเรียง → ตรวจซ้ำ → แจ้งผู้เกี่ยวข้อง", "Performance: รวบรวมข้อมูล → ตรวจ → ประเมิน → ส่งผู้รับผิดชอบ", "พัฒนา OMBOG: เก็บปัญหาหน้างาน → แจ้ง Programmer → ทดสอบหลังแก้"],tools:["OMBOG (ระบบ HR)", "Google Drive", "Check-in / Check-out", "สรุปจากหัวหน้าแต่ละทีม"],issues:["เงินเดือน/วันลา/ปันผลไม่ตรง → หยุดสรุปยอด เทียบ OMBOG + สรุปหัวหน้าทีม แก้แล้วคำนวณใหม่", "เวลาเข้า-ออกผิด → ตรวจ Check-in/out จริง แก้ไขหรือแจ้ง Programmer", "ระบบ Error → เก็บหลักฐาน แจ้ง Programmer ทดสอบหลังแก้", "ประกาศผิด → แก้ข้อมูลต้นทาง ชี้แจงให้ชัดเจน"],ai:["ช่วยร่าง/ตรวจประกาศรับสมัคร", "เทียบข้อมูลค่าตอบแทนหาจุดต่าง", "สรุปข้อมูล Performance", "แจ้งเตือนวันลา / เวลาเข้า-ออกผิดปกติ", "⚠️ กฎ: ห้ามใช้ OMBOG แหล่งเดียวสรุปค่าตอบแทน — คนยืนยันก่อนจ่ายเสมอ"]},

/* เทมเพลตวันที่ไทย: รองรับทั้ง YYYY-MM-DD และ MM-DD (ปีปัจจุบัน) */
const THMON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const THDAY=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
function fmtDate(mmdd,withYear){
  if(!mmdd)return '-';const p=String(mmdd).split('-').map(Number),full=p.length===3;
  const y=full?p[0]:Number(TODAY_ISO?.slice(0,4)||new Date().getFullYear()),m=full?p[1]:p[0],d=full?p[2]:p[1],dt=new Date(y,m-1,d);
  return THDAY[dt.getDay()]+' '+d+' '+THMON[m-1]+(withYear?' '+String(y+543).slice(-2):'');
}
const normSp=s=>(s||'').replace(/\s+/g,' ').trim();
/* ระยะเวลาดำเนินการ (SLA) */
const DFROM=s=>{const p=String(s||'').split('-').map(Number),y=Number(TODAY_ISO?.slice(0,4)||new Date().getFullYear());return p.length===3?new Date(p[0],p[1]-1,p[2]):new Date(y,p[0]-1,p[1]);};
const dateISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addFrom=(s,n)=>{const d=DFROM(s);d.setDate(d.getDate()+n);return dateISO(d);};
const slaUnitTxt=un=>un==='hr'?'ชม.':'วัน';
const slaOf=t=>t.sla||{n:Math.max(1,Math.round((DFROM(t.due)-DFROM(t.start))/86400000)),unit:'day'};
const slaText=t=>{const s=slaOf(t);return s.n+' '+slaUnitTxt(s.unit);};
const slaOverdue=t=>{if(t.status==='done')return false;const s=slaOf(t);if(s.unit!=='day')return false;return addFrom(t.start,s.n)<TODAY_ISO;};
function bangkokTodayISO(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:ORG_TIMEZONE,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const get=t=>parts.find(p=>p.type===t)?.value;return `${get('year')}-${get('month')}-${get('day')}`;}
const TODAY_ISO=bangkokTodayISO(),TODAY_MMDD=TODAY_ISO.slice(5);

function canCreateTask(dept){return !!SB&&!!ACCESS_PROFILE&&(canAdminAccess()||(AUTH_DB_ROLE==='lead'&&MANAGE_DEPTS.includes(dept)));}

function taskSlaMinutes(s){if(!s)return null;return Math.max(1,Number(s.n)||1)*(s.unit==='hr'?60:1440);}
async function createTask(d){
  const assignees=(d.assignees&&d.assignees.length)?d.assignees:(d.assignee?[d.assignee]:['a']);
  if(CLOUD){
    if(!canCreateTask(d.dept))throw new Error('บัญชีนี้ไม่มีสิทธิ์สร้างงานในแผนก '+deptName(d.dept));
    const payload={tags:d.tags||[],sop:sopForDept(d.dept),sub:[]};
    const inserted=await SB.from('tasks').insert({department_code:d.dept,title:normSp(d.title)||'งานใหม่',description:normSp(d.desc),status:'todo',priority:d.prio||'mid',creator_id:ACCESS_PROFILE.id,start_at:TODAY_ISO+'T00:00:00+07:00',due_at:(d.due||addFrom(TODAY_ISO,5))+'T23:59:59+07:00',sla_minutes:taskSlaMinutes(d.sla),prototype_payload:payload}).select('id,task_no').single();
    if(inserted.error)throw inserted.error;
    const validAssignees=assignees.filter(id=>TASK_PROFILES.some(p=>p.id===id));
    if(validAssignees.length){const assigned=await SB.from('task_assignees').insert(validAssignees.map(user_id=>({task_id:inserted.data.id,user_id,assigned_by:ACCESS_PROFILE.id})));if(assigned.error)throw assigned.error;}
    await cloudLoadTasks();
    return TASKS.find(t=>t.dbId===inserted.data.id);
  }
  const t={id:nextTaskId(),dept:d.dept,title:normSp(d.title)||'งานใหม่',creator:ROLE_META[ROLE].u,assignee:assignees[0],assignees,
    status:'todo',prio:d.prio||'mid',start:TODAY_ISO,due:d.due||addFrom(TODAY_ISO,5),spent:0,ontime:true,sla:d.sla||null,
    tags:d.tags||[],sop:sopForDept(d.dept),desc:normSp(d.desc),sub:[],log:[{who:ROLE_META[ROLE].u,txt:'สร้างงาน',time:'เมื่อสักครู่'}]};
  TASKS.unshift(t);
  logFeed('🆕','#eef2ff',`<b>${shortName(t.creator)}</b> สร้างงาน <b>${t.id}</b> ${t.title} · มอบ ${assignees.map(shortName).join(', ')}`);
  return t;
}
async function cloudUpdateTask(t,changes){if(!CLOUD||!t.dbId)return;const r=await SB.from('tasks').update(changes).eq('id',t.dbId).select('id').single();if(r.error)throw r.error;}

  t.status=st;(t.log=t.log||[]).unshift({who:ROLE_META[ROLE].u,txt:'เปลี่ยนสถานะเป็น '+STATUS[st].t,time:'เมื่อสักครู่'});

async function addSub(id){

function downloadRows(rows,name){
  const esc=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv=rows.map(r=>r.map(esc).join(',')).join('\r\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  toast('ส่งออกไฟล์ '+name+' ('+(rows.length-1>0?rows.length-1:0)+' บรรทัด) แล้ว');}

function reportDeptMetrics(code,scope=reportScope(),activities=reportActivityRows(),issues=reportIssueRows()){
  const work=scope.filter(t=>t.dept===code),activity=activities.filter(r=>r.department_code===code),problem=issues.filter(p=>p.dept===code);

  const issueFollowup=problem.filter(p=>!reportIssueResolved(p)).length;
  const hours=activity.reduce((sum,row)=>sum+activityCountedDuration(row),0);
  return {code,work,activity,problem,total:work.length+activity.length+problem.length,completed:workDone.length+activityDone.length+issueDone.length,followup:workFollowup+activityFollowup+issueFollowup,hours,
    sources:[work.length&&`งาน ${nf(work.length)}`,activity.length&&`กิจกรรม ${nf(activity.length)}`,problem.length&&`ปัญหา ${nf(problem.length)}`].filter(Boolean)};

function speechOK(){return 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;}

  if(/คู่มือ|sop|ขั้นตอน/.test(s)){go('sop');return;}

  if(/ถามข้อมูล|talk|วิเคราะห์/.test(s)){go('talk');return;}
  if(/ส่งออก|export|ดาวน์โหลด/.test(s)){go('board');setTimeout(exportCurrent,200);return;}
  if(dep&&/กรอง|แผนก|ดู/.test(s)){F.dept=dep.code;go('board');toast('กรองแผนก '+dep.name);return;}
  if(dep){F.dept=dep.code;go('board');toast('กรองแผนก '+dep.name);return;}

}

/* ===== AI วิเคราะห์คำสั่ง (เก่งขึ้น) ===== */
function addDays(n){const d=DFROM(TODAY_ISO);d.setDate(d.getDate()+n);return dateISO(d);}
function nextWeekday(target){const d=DFROM(TODAY_ISO);let diff=(target-d.getDay()+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff);return dateISO(d);}
function analyzeCommand(raw){
  const s=raw.toLowerCase();
  const dmap=[['GRAPHIC',/แบนเนอร์|ออกแบบ|กราฟิก|โลโก้|วิดีโอ|ภาพ|อาร์ต|โมชั่น/],['CRM',/โทร|ลูกค้า|retention|วินแบ็ก|win-?back|ดูแลลูกค้า|เติมเงิน/],['MKT',/คอนเทนต์|โพสต์|แคมเปญ|การตลาด|โฆษณา|engagement|โปรโมชั่น/],['FIN',/เบิก|โอน|การเงิน|สรุปเดือน|กระทบยอด|เงินสด/],['ADMIN',/แชท|ตอบลูกค้า|เคส|แอดมิน/],['QC',/ตรวจแชท|คุณภาพ|นายหน้า|บัญชีหน้าเว็บ|qc/]];
  let dept='GRAPHIC';for(const[c,re]of dmap){if(re.test(s)){dept=c;break;}}
  let prio='mid';if(/ด่วน|เร่ง|ทันที|วันนี้/.test(s))prio='high';else if(/ไม่เร่ง|เมื่อว่าง|ไม่รีบ/.test(s))prio='low';
  let due=addDays(5);const wd={'อาทิตย์':0,'จันทร์':1,'อังคาร':2,'พุธ':3,'พฤหัส':4,'ศุกร์':5,'เสาร์':6};const mIn=s.match(/ภายใน\s*(\d+)\s*วัน/);
  if(/วันนี้/.test(s))due=addDays(0);else if(/พรุ่งนี้/.test(s))due=addDays(1);else if(/มะรืน/.test(s))due=addDays(2);
  else if(/สัปดาห์หน้า/.test(s))due=addDays(7);else if(/สิ้นเดือน/.test(s)){const d=DFROM(TODAY_ISO);d.setMonth(d.getMonth()+1,0);due=dateISO(d);}else if(mIn)due=addDays(+mIn[1]);
  else{for(const k in wd){if(s.includes(k)){due=nextWeekday(wd[k]);break;}}}
  let title=normSp(raw.replace(/ส่ง\s*(วันนี้|พรุ่งนี้|มะรืน|สัปดาห์หน้า|สิ้นเดือน|ภายใน\s*\d+\s*วัน)/g,'').replace(/(อาทิตย์|จันทร์|อังคาร|พุธ|พฤหัส|ศุกร์|เสาร์)นี้?/g,'').replace(/ภายใน\s*\d+\s*วัน|ด่วนที่สุด|เร่งด่วน|ด่วน/g,''))||raw;
  const grp=GROUPS.find(g=>g.dept===dept);const members=CLOUD?TASK_PROFILES.filter(p=>(p.department_codes||[p.department_code]).includes(dept)).map(p=>p.id):(grp?grp.members:['a']);
  const load=id=>TASKS.filter(t=>assigneesOf(t).includes(id)&&t.status!=='done').length;
  const assignee=members.slice().sort((a,b)=>load(a)-load(b))[0]||ACCESS_PROFILE?.id||ASSIGNABLE[0]||'';
  const sop=SOPS.find(x=>x.dept===dept);const checklist=sop?sop.steps.slice(0,4):['ดำเนินการ','ตรวจสอบ','ส่งอนุมัติ'];
  const desc='ดำเนินการ "'+title+'" ตามมาตรฐานแผนก'+deptName(dept)+' พร้อมตรวจสอบความถูกต้องก่อนส่ง';
  const kb=KB.find(k=>k.dept===dept);

}

function sparkline(pts,w=260,h=64){
  const max=Math.max(...pts),min=Math.min(...pts)-2,rng=(max-min)||1;
  const step=w/(pts.length-1);
  const xy=pts.map((p,i)=>[i*step,h-((p-min)/rng)*(h-10)-5]);
  const line=xy.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area=line+` L${w} ${h} L0 ${h} Z`;
  const dots=xy.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="#2158c8"/>`).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2158c8" stop-opacity=".18"/><stop offset="1" stop-color="#2158c8" stop-opacity="0"/></linearGradient></defs>

}

function applyFilters(list){
  let r=list.filter(t=>{
    if(F.q){const q=F.q.toLowerCase();if(!(t.title.toLowerCase().includes(q)||t.id.toLowerCase().includes(q)||t.tags.join(' ').toLowerCase().includes(q)))return false;}
    if(F.source==='work'&&!['task','graphic'].includes(t._source))return false;
    if(F.source&&F.source!=='work'&&t._source!==F.source)return false;
    if(F.dept&&t.dept!==F.dept)return false;
    if(F.status&&t.status!==F.status)return false;
    if(F.prio&&t.prio!==F.prio)return false;
    if(F.assignee&&t.assignee!==F.assignee)return false;
    if(F.period==='today'&&d2(t.due)!==TODAY_ISO)return false;
    if(F.period==='overdue'&&!dashboardIsOverdue(t))return false;
    if(F.period==='active'&&t.status==='done')return false;
    if(F.period==='missingDue'&&(t._deadline===false||t.status==='done'||dashboardDueAt(t)))return false;
    if(F.reportFrom&&!integrityInRange(integrityWorkDate(t),{from:F.reportFrom,to:F.reportTo}))return false;
    if(F.dateFrom&&d2(t.due)<F.dateFrom)return false;
    if(F.dateTo&&d2(t.start)>F.dateTo)return false;
    return true;
  });
  const key=F.sort;
  r.sort((a,b)=>{let x,y;
    if(key==='prio'){const o={high:0,mid:1,low:2};x=o[a.prio];y=o[b.prio];}
    else if(key==='status'){const o=Object.keys(STATUS);x=o.indexOf(a.status);y=o.indexOf(b.status);}
    else if(key==='spent'){x=a.spent;y=b.spent;}
    else {x=a[key];y=b[key];}
    return (x>y?1:x<y?-1:0)*F.dir;});
  return r;
}

function gpSetDate(k,v){GF[k]=v;if(GF.dateFrom&&GF.dateTo&&GF.dateFrom>GF.dateTo){if(k==='dateFrom')GF.dateTo=v;else GF.dateFrom=v;}GP_VISIBLE_LIMITS={};RENDER.graphic();}
function gpClearFilters(){GF.project='';GF.status='';GF.q='';GF.person='';GF.dateFrom='';GF.dateTo='';GP_VISIBLE_LIMITS={};RENDER.graphic();}
function gpJobChecks(id){return GRAPHIC_CHECKS.filter(x=>x.job_id===id);}
function gpJobFiles(id){return GRAPHIC_FILES.filter(x=>x.job_id===id);}
function gpMember(id){return GRAPHIC_MEMBERS.find(x=>x.trello_member_id===id)||{};}
function gpJobMemberRows(id){return GRAPHIC_JOB_MEMBERS.filter(x=>x.job_id===id).map(x=>({...x,...gpMember(x.trello_member_id)}));}
function gpAvatar(m){return m.avatar_url?`<img class="gp-avatar" src="${esc(m.avatar_url)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:`<span class="gp-avatar fallback">${esc((m.full_name||m.username||'?').slice(0,2).toUpperCase())}</span>`;}
function gpJobCard(j){const cs=gpJobChecks(j.id),done=cs.filter(x=>x.done).length,p=gpProject(j.project_id),members=gpJobMemberRows(j.id);return `<div class="gp-job" draggable="${canManageGraphic()||j.assignee_id===ACCESS_PROFILE?.id}" ondragstart="gpDragStart(event,'${j.id}')" ondragend="gpDragEnd(event)" onclick="openGraphicJob('${j.id}')">${j.cover_url?`<img class="gp-cover" src="${esc(j.cover_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:j.cover_color?`<div class="gp-cover" style="background:${esc(j.cover_color)};height:42px"></div>`:''}<div class="gp-meta"><span class="tag">G-${j.job_no}</span>${j.priority!=='mid'?`<span class="tag" style="color:${j.priority==='urgent'?'var(--red)':'var(--amber)'}">${GP_PRIO[j.priority]}</span>`:''}</div><h4>${esc(j.title)}</h4><div class="gp-meta"><span>${esc(p.name||'ไม่ระบุโปรเจกต์')}</span>${j.assignee_name?`<span>· ${esc(j.assignee_name)}</span>`:''}</div>${members.length?`<div class="gp-member-list" style="margin-top:6px">${members.slice(0,4).map(gpAvatar).join('')}</div>`:''}<div class="gp-meta" style="margin-top:6px"><span class="${gpLate(j)?'gp-due-late':''}">${gpLate(j)?'⚠ เกินกำหนด':'กำหนด'} ${gpDate(j.due_at)}</span>${j.revision_count?`<span>· แก้ ${j.revision_count} รอบ</span>`:''}</div>${cs.length?`<div class="gp-progress"><i style="width:${Math.round(done/cs.length*100)}%"></i></div><div class="gp-meta" style="margin-top:4px">Checklist ${done}/${cs.length}</div>`:''}</div>`;}
function gpTab(tab){GF.tab=tab;GP_VISIBLE_LIMITS={};RENDER.graphic();}
function gpSet(k,v){GF[k]=v;GP_VISIBLE_LIMITS={};RENDER.graphic();}
function gpShowMore(status){GP_VISIBLE_LIMITS[status]=(GP_VISIBLE_LIMITS[status]||GP_COLUMN_PAGE_SIZE)+GP_COLUMN_PAGE_SIZE;renderGraphicBoard();}
let GP_DRAG_ID='';
function gpDragStart(e,id){GP_DRAG_ID=id;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);}
function gpDragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.gp-col.drag-over').forEach(x=>x.classList.remove('drag-over'));}
function gpDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');e.dataTransfer.dropEffect='move';}
function gpDragLeave(e){if(!e.currentTarget.contains(e.relatedTarget))e.currentTarget.classList.remove('drag-over');}
async function gpDrop(e,status){e.preventDefault();e.currentTarget.classList.remove('drag-over');const id=e.dataTransfer.getData('text/plain')||GP_DRAG_ID,j=GRAPHIC_JOBS.find(x=>x.id===id);GP_DRAG_ID='';if(!j||j.status===status)return;await moveGraphicJob(id,status,true);}
function gpFilterBar(){const range=gpDataRange(),people=gpPersonOptions(),scope=gpGlobalVisible();return `<div class="gp-global-filter"><div class="field"><label>วันที่เริ่มต้น</label><input class="fin" type="date" value="${esc(GF.dateFrom)}" onchange="gpSetDate('dateFrom',this.value)"></div><div class="field"><label>วันที่สิ้นสุด</label><input class="fin" type="date" value="${esc(GF.dateTo)}" onchange="gpSetDate('dateTo',this.value)"></div><div class="field person"><label>ผู้รับผิดชอบ</label><select class="fin" onchange="gpSet('person',this.value)"><option value="">ทุกคน</option><option value="__UNASSIGNED__" ${GF.person==='__UNASSIGNED__'?'selected':''}>ยังไม่มอบหมาย</option>${people.map(name=>`<option value="${esc(name)}" ${GF.person===name?'selected':''}>${esc(name)}</option>`).join('')}</select></div><button class="tbtn sm" onclick="gpClearFilters()">ล้างตัวกรอง</button><div class="gp-filter-summary">${range?`ข้อมูลทั้งหมด ${gpDate(range.from)} – ${gpDate(range.to)} · `:''}แสดง ${nf(scope.length)} จาก ${nf(GRAPHIC_JOBS.length)} งาน</div></div>`;}

RENDER.graphic=function(){
  if(!GRAPHIC_READY){main.innerHTML=`${crumb('หน้าแรก','Graphic Production')}<div class="page-h"><div><h1>Graphic Production</h1><p>กำลังโหลดงานจากฐานข้อมูล…</p></div></div>`;loadGraphic();return;}
  const all=gpGlobalVisible(),active=all.filter(x=>!['done'].includes(x.status)),review=all.filter(x=>x.status==='review'),late=all.filter(gpLate),monthDone=all.filter(x=>x.status==='done'&&x.completed_at&&new Date(x.completed_at).getMonth()===new Date().getMonth()),revs=all.reduce((s,x)=>s+x.revision_count,0);
  const tabs=[['dashboard','ภาพรวม'],['board','บอร์ดงาน'],['monthly','งานรายเดือน'],['projects','ทีม / ผู้รับผิดชอบ']];
  main.innerHTML=`${crumb('หน้าแรก','Graphic Production')}<div class="page-h"><div><h1>Graphic Production</h1><p>รับบรีฟ · ผลิต · ตรวจงาน · แก้ไข · ส่งมอบใน Company Hub ที่เดียว</p>${sourceBadge('live','COMPANY HUB LIVE',`${nf(all.length)} จาก ${nf(GRAPHIC_JOBS.length)} งาน · อัปเดตจากฐานข้อมูลกลางทันที`)}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="tbtn primary" onclick="openGraphicBrief()">+ เพิ่มการ์ด / รับบรีฟ</button></div></div><div class="gp-tabs">${tabs.map(x=>`<button class="${GF.tab===x[0]?'active':''}" onclick="gpTab('${x[0]}')">${x[1]}</button>`).join('')}</div>${gpFilterBar()}<div class="gp-kpis"><div class="gp-kpi"><span>งานที่กำลังเดิน</span><b>${active.length}</b></div><div class="gp-kpi"><span>รอตรวจ</span><b>${review.length}</b></div><div class="gp-kpi"><span>เกินกำหนด</span><b style="color:${late.length?'var(--red)':'inherit'}">${late.length}</b></div><div class="gp-kpi"><span>เสร็จเดือนนี้</span><b>${monthDone.length}</b></div><div class="gp-kpi"><span>รอบแก้สะสม</span><b>${revs}</b></div></div><div id="gpBody"></div>`;
  if(GF.tab==='dashboard')renderGraphicDashboard();else if(GF.tab==='monthly')renderGraphicMonthly();else if(GF.tab==='projects')renderGraphicProjects();else renderGraphicBoard();
};
function gpToolbar(){return `<div class="gp-toolbar"><div class="field grow"><label>ค้นหา</label><input class="fin" value="${esc(GF.q)}" placeholder="ชื่องาน / บรีฟ / ผู้รับผิดชอบ" oninput="GF.q=this.value;clearTimeout(window._gpt);window._gpt=setTimeout(()=>renderGraphicBoard(),200)"></div><div class="field"><label>โปรเจกต์</label><select class="fin" onchange="gpSet('project',this.value)"><option value="">ทุกโปรเจกต์</option>${GRAPHIC_PROJECTS.filter(x=>x.active).map(p=>`<option value="${p.id}" ${GF.project===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>สถานะ</label><select class="fin" onchange="gpSet('status',this.value)"><option value="">ทุกสถานะ</option>${Object.entries(GP_STATUS).map(([k,v])=>`<option value="${k}" ${GF.status===k?'selected':''}>${v.t}</option>`).join('')}</select></div></div>`;}
function renderGraphicBoard(){const box=document.getElementById('gpBody');if(!box)return;const list=gpVisible();box.innerHTML=gpToolbar()+`<div class="gp-board">${Object.entries(GP_STATUS).map(([s,m])=>{const rows=list.filter(x=>x.status===s).sort((a,b)=>(a.trello_position??Number.MAX_SAFE_INTEGER)-(b.trello_position??Number.MAX_SAFE_INTEGER)),limit=GP_VISIBLE_LIMITS[s]||GP_COLUMN_PAGE_SIZE,shown=rows.slice(0,limit);return `<section class="gp-col" ondragover="gpDragOver(event)" ondragleave="gpDragLeave(event)" ondrop="gpDrop(event,'${s}')"><div class="gp-col-h"><span><i style="background:${m.c}"></i>${m.t}</span><span class="gp-count">${rows.length}</span></div>${shown.map(gpJobCard).join('')||'<div class="gp-empty">ไม่มีงาน</div>'}${rows.length>shown.length?`<button class="gp-more" onclick="gpShowMore('${s}')">แสดงเพิ่ม ${Math.min(GP_COLUMN_PAGE_SIZE,rows.length-shown.length)} · เหลือ ${rows.length-shown.length}</button>`:''}</section>`;}).join('')}</div><div class="source-note" style="margin-top:8px">ลากการ์ดข้ามสถานะได้ · Kanban แสดงครั้งละ ${GP_COLUMN_PAGE_SIZE} งานต่อสถานะ เพื่อลดภาระเครื่อง</div>`;}
function renderGraphicDashboard(){const box=document.getElementById('gpBody');if(!box)return;const scoped=gpGlobalVisible(),active=scoped.filter(x=>x.status!=='done'),byProject=GRAPHIC_PROJECTS.map(p=>({p,n:active.filter(x=>x.project_id===p.id).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n),personNames=[...new Set(active.flatMap(j=>gpJobPeople(j).length?gpJobPeople(j):['ยังไม่มอบหมาย']))],byPerson=personNames.map(n=>({n,v:active.filter(j=>n==='ยังไม่มอบหมาย'?!gpJobPeople(j).length:gpJobPeople(j).includes(n)).length})).sort((a,b)=>b.v-a.v);box.innerHTML=`<div class="two"><div class="card pad"><h3>งานค้างตามโปรเจกต์</h3>${byProject.length?hbars(byProject.slice(0,10).map(x=>({label:x.p.name,v:x.n}))):'<div class="gp-empty">ไม่มีงานค้าง</div>'}</div><div class="card pad"><h3>Workload ทีมกราฟิก</h3>${byPerson.length?hbars(byPerson.slice(0,10).map(x=>({label:x.n,v:x.v}))):'<div class="gp-empty">ยังไม่มีการมอบหมาย</div>'}</div></div><div class="card pad" style="margin-top:12px"><h3>งานที่ต้องจัดการทันที</h3><div class="gp-projects" style="margin-top:10px">${scoped.filter(x=>gpLate(x)||x.status==='review'||x.status==='revision').sort((a,b)=>gpLate(b)-gpLate(a)).slice(0,12).map(gpJobCard).join('')||'<div class="gp-empty">ไม่มีงานเร่งด่วน</div>'}</div></div>`;}
function renderGraphicMonthly(){const box=document.getElementById('gpBody');if(!box)return;const rows=gpGlobalVisible().filter(x=>x.status==='monthly'||x.work_type==='monthly');box.innerHTML=`<div class="ai-note"><b>งานรายเดือน:</b> แตกเป้าหมายด้วย Checklist และใช้วันกำหนดจริง เพื่อให้ Dashboard เตือนได้</div><div class="gp-projects" style="margin-top:12px">${rows.map(gpJobCard).join('')||'<div class="gp-empty">ยังไม่มีงานรายเดือน</div>'}</div>`;}
function gpAccountStatus(m){return m.linked_profile_id?'<span class="tag" style="color:var(--green)">เชื่อมบัญชีแล้ว</span>':m.email?'<span class="tag" style="color:var(--amber)">พร้อมเชิญ</span>':'<span class="tag">รออีเมล</span>';}
function gpMemberAccounts(){if(!canManageGraphic())return'';return `<div class="card pad" style="margin-top:14px"><div class="card-h" style="padding:0 0 10px"><div><h3>สมาชิกทีมกราฟิก → บัญชี Company Hub</h3><div class="muted" style="font-size:11px">กรอกอีเมลจริง แล้วเชื่อมบัญชีเดิมหรือส่งคำเชิญสร้างบัญชีใหม่</div></div><span class="tag">${GRAPHIC_MEMBERS.length} คน</span></div><div class="gp-account-grid">${GRAPHIC_MEMBERS.map(m=>`<div class="gp-account"><div style="display:flex;align-items:center;gap:8px">${gpAvatar(m)}<div><b>${esc(m.full_name||m.username)}</b><div class="muted" style="font-size:10px">@${esc(m.username||'-')} · ${gpAccountStatus(m)}</div></div></div><input class="fin" id="gmEmail_${m.trello_member_id}" type="email" value="${esc(m.email||'')}" placeholder="name@company.com"><select class="fin" id="gmProfile_${m.trello_member_id}"><option value="">ยังไม่เชื่อมบัญชีเดิม</option>${GRAPHIC_PEOPLE.map(p=>`<option value="${p.id}" ${m.linked_profile_id===p.id?'selected':''}>${esc(p.display_name||p.email)} · ${esc(p.email)}</option>`).join('')}</select><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="tbtn sm" onclick="saveGraphicMemberLink('${m.trello_member_id}')">บันทึกการเชื่อม</button>${!m.linked_profile_id&&canAdminAccess()?`<button class="tbtn sm primary" onclick="inviteGraphicMember('${m.trello_member_id}')">สร้าง/เชิญบัญชี</button>`:''}</div></div>`).join('')||'<div class="gp-empty">ยังไม่มีรายชื่อสมาชิกทีม</div>'}</div></div>`;}
function gpOpenProject(id){GF.project=id;GF.status='';GF.q='';GF.tab='board';GP_VISIBLE_LIMITS={};RENDER.graphic();}
function renderGraphicProjects(){const box=document.getElementById('gpBody');if(!box)return;const scoped=gpGlobalVisible();box.innerHTML=`<div class="gp-import"><b>เลือกทีม / ผู้รับผิดชอบเพื่อดูงานทั้งหมด</b><div class="muted" style="font-size:11.5px;margin-top:4px">กดการ์ดเพื่อเปิด Kanban ที่กรองเฉพาะงานของทีมหรือบุคคลนั้น</div></div><div class="gp-projects">${GRAPHIC_PROJECTS.map(p=>{const rows=scoped.filter(x=>x.project_id===p.id);return `<div class="gp-project clickable" role="button" tabindex="0" aria-label="ดูงาน ${esc(p.name)} จำนวน ${rows.length} งาน" onclick="gpOpenProject('${p.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();gpOpenProject('${p.id}')}"><div class="gp-meta"><span class="tag">${esc(p.workstream.toUpperCase())}</span><span>${rows.length} งาน</span></div><h3>${esc(p.name)}</h3><div class="muted" style="font-size:11px">ค้าง ${rows.filter(x=>x.status!=='done').length} · เสร็จ ${rows.filter(x=>x.status==='done').length}</div><div class="gp-meta" style="margin-top:10px;color:var(--blue-700)">ดูรายการงานทั้งหมด →</div></div>`;}).join('')}</div>${gpMemberAccounts()}`;}
async function saveGraphicMemberLink(id){const email=normSp(val('gmEmail_'+id)),profile=val('gmProfile_'+id)||null;try{const r=await SB.rpc('set_graphic_trello_member_link',{p_trello_member_id:id,p_email:email||null,p_profile_id:profile});if(r.error)throw r.error;toast('บันทึกการเชื่อมสมาชิกแล้ว');GRAPHIC_READY=false;await loadGraphic();GF.tab='projects';RENDER.graphic();}catch(e){toast('บันทึกไม่สำเร็จ · '+(e.message||''),'info');}}
async function inviteGraphicMember(id){const m=gpMember(id),email=normSp(val('gmEmail_'+id));if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('กรุณากรอกอีเมลจริงของสมาชิกก่อน','info');return;}if(!confirm(`ส่งคำเชิญสร้างบัญชี Company Hub ไปที่ ${email} ใช่หรือไม่?`))return;try{const r=await SB.functions.invoke('invite-company-user',{body:{email,display_name:m.full_name||m.username,position_title:'Graphic Designer',role:'staff',department_code:'GRAPHIC',visible_departments:['GRAPHIC'],managed_departments:[],trello_member_id:id}});if(r.error)throw r.error;if(r.data&&r.data.error)throw new Error(r.data.error);toast('ส่งคำเชิญและสร้างบัญชีแล้ว');GRAPHIC_READY=false;await loadGraphic();GF.tab='projects';RENDER.graphic();}catch(e){toast('สร้างบัญชีไม่สำเร็จ · '+(e.message||'ตรวจ Edge Function'),'info');}}

async function sbAllRows(table,order,ascending=true){const all=[];for(let from=0;;from+=1000){const r=await SB.from(table).select('*').order(order,{ascending}).range(from,from+999);if(r.error)throw r.error;const rows=r.data||[];all.push(...rows);if(rows.length<1000)break;}return{data:all,error:null};}
async function loadGraphic(){if(!SB||!canViewDept('GRAPHIC'))return;try{const [jr,pr,fr,cr,ur,mr,jmr]=await Promise.all([sbAllRows('graphic_jobs','updated_at',false),SB.from('graphic_projects').select('*').order('name'),sbAllRows('graphic_job_files','created_at'),sbAllRows('graphic_job_checklist_items','position'),SB.rpc('activity_entry_people').then(r=>({...r,data:(r.data||[]).filter(p=>p.department_code==='GRAPHIC')})),SB.from('graphic_trello_members').select('*').order('full_name'),sbAllRows('graphic_job_members','created_at')]);const err=[jr,pr,fr,cr,ur,mr,jmr].find(x=>x.error);if(err)throw err.error;const excludedProjects=new Set((pr.data||[]).filter(gpExcludedProject).map(p=>p.id));GRAPHIC_PROJECTS=(pr.data||[]).filter(p=>!excludedProjects.has(p.id));GRAPHIC_JOBS=(jr.data||[]).filter(j=>!excludedProjects.has(j.project_id));const visibleJobs=new Set(GRAPHIC_JOBS.map(j=>j.id));GRAPHIC_FILES=(fr.data||[]).filter(x=>visibleJobs.has(x.job_id));GRAPHIC_CHECKS=(cr.data||[]).filter(x=>visibleJobs.has(x.job_id));GRAPHIC_PEOPLE=ur.data||[];GRAPHIC_MEMBERS=mr.data||[];GRAPHIC_JOB_MEMBERS=(jmr.data||[]).filter(x=>visibleJobs.has(x.job_id));GRAPHIC_READY=true;if(VIEW==='graphic')RENDER.graphic();else if(VIEW==='dash')RENDER.dash();else if(VIEW==='board')RENDER.board(BOARD_DEPT);else if(VIEW==='timeline')RENDER.timeline();}catch(e){GRAPHIC_READY=false;if(VIEW==='graphic')main.innerHTML=`${crumb('หน้าแรก','Graphic Production')}<div class="ai-note"><b>ยังเปิดโมดูลไม่ได้</b><br>กรุณารัน Migration 011 · ${esc(e.message||'')}</div>`;throw e;}}

function gpExtractLinks(body){return [...new Set((body||'').match(/https?:\/\/[^\s\])>\"]+/g)||[])];}
function gpSafeHttpUrl(value){try{const url=new URL(String(value));return url.protocol==='http:'||url.protocol==='https:'?url.href:'';}catch(e){return'';}}
function gpLinkPlainText(value){const text=String(value||''),re=/https?:\/\/[^\s<>\"']+/gi;let html='',last=0,match;while((match=re.exec(text))){html+=esc(text.slice(last,match.index));let href=match[0],tail='';while(/[\]\),.!?;:]$/.test(href)){tail=href.slice(-1)+tail;href=href.slice(0,-1);}const safe=gpSafeHttpUrl(href);html+=safe?`<a class="gp-rich-link" href="${esc(safe)}" target="_blank" rel="noopener noreferrer">${esc(href)}</a>${esc(tail)}`:esc(match[0]);last=match.index+match[0].length;}return html+esc(text.slice(last));}
function gpRichText(value){const tokens=[];const marked=String(value==null?'':value).replace(/\[([^\]\r\n]+)\]\((https?:\/\/[^\s)]+)(?:\s+(?:\"[^\"]*\"|'[^']*'))?\)/gi,(all,label,url)=>{const safe=gpSafeHttpUrl(url);if(!safe)return all;const index=tokens.push(`<a class="gp-rich-link" href="${esc(safe)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`)-1;return `\uE000${index}\uE001`;});return marked.split(/(\uE000\d+\uE001)/).map(part=>{const match=part.match(/^\uE000(\d+)\uE001$/);return match?tokens[Number(match[1])]:gpLinkPlainText(part);}).join('');}

function boardMmdd(value){const s=String(value||'');if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(5,10);const d=new Date(value);return Number.isNaN(d.getTime())?'':String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function boardActivityStatus(row){
  const s=String(row.status||'').toLowerCase();
  if((row.time_flag&&row.time_flag!=='ok')||(typeof activityReviewFlags==='function'&&activityReviewFlags(row).length))return'review';
  if(/completed|done|เสร็จ|สำเร็จ/.test(s))return'done';
  if(/waiting|pending|block|รอ|ค้าง|เลื่อน|ปัญหา/.test(s)||row.operational_issue)return'block';
  if(/progress|doing|กำลัง|ดำเนิน/.test(s))return'doing';
  return'todo';
}

  };});
}

function kpiStatus(pct){return pct>=100?{t:'ดีเยี่ยม',c:'var(--green)',ic:'✓'}:pct>=95?{t:'ดีมาก',c:'var(--green)',ic:'✓'}:pct>=90?{t:'ดี',c:'var(--amber)',ic:'≈'}:pct>=80?{t:'พอใช้',c:'var(--amber)',ic:'≈'}:{t:'ต้องปรับปรุง',c:'var(--red)',ic:'!'};}
function kpiList(c,editable){return KPI[c].map((k,i)=>{const st=kpiStatus(k.pct);const over=k.pct>100;const real=k.tgt!=null;return `
  <div class="kpi-item">
    <span class="kpi-icn" style="background:${st.c}" title="${st.t}">${st.ic}</span>
    <div style="flex:1;min-width:0">
      <div class="kpi-name">${k.n}</div>
      <div class="bar" style="margin:6px 0 4px"><i style="width:${Math.min(k.pct,100)}%;background:${st.c}"></i></div>
      <div class="kpi-val muted">ทำได้ <b style="color:var(--ink)">${acDisp(k)}</b> · เป้า ${k.tg}${real?` · น้ำหนัก ${Math.round(k.w*100)}% · Achievement <b style="color:${st.c}">${k.pct}%</b>`:''}</div>
      ${real&&editable&&!CLOUD?`<div class="kpi-edit">Actual รายเดือน <input type="number" min="0" max="100" step="0.1" value="${k.ac}" onchange="setKpiActual('${c}',${i},this.value)"> % <span class="muted">แก้แล้วคำนวณคะแนนใหม่ให้อัตโนมัติ</span></div>`:''}
    </div>
    <span class="pill" style="background:${st.c};margin-top:2px">${st.t}${over?' ▲':''}</span>
  </div>`;}).join('');}
/* แก้ค่า Actual รายเดือน → คำนวณใหม่ + บันทึก */
function setKpiActual(c,i,v){let n=parseFloat(v);if(isNaN(n))return;n=Math.max(0,Math.min(100,n));KPI[c][i].ac=n;KPI[c][i].pct=kpiAch(KPI[c][i]);saveState();refresh();toast('อัปเดต '+deptName(c)+' — คำนวณคะแนนใหม่แล้ว');}

function scopeKey(){return REP_DEPT||(REP_GROUP?('grp'+REP_GROUP):(isExecutiveRole()?'company':currentDept()));}
function getEdit(k,def){const o=REPORT_EDITS[scopeKey()]||{};return (o[k]!==undefined&&o[k]!=='')?o[k]:def;}
function setEdit(k,v){(REPORT_EDITS[scopeKey()]=REPORT_EDITS[scopeKey()]||{})[k]=v;saveState();toast('บันทึกการแก้ไขแล้ว');}
function monthlyData(){
  const isExec=isExecutiveRole(),depts=reportDepts();
  const allWork=dashboardAllWork();
  const base=REP_MONTH==='09'?allWork.filter(t=>t._source==='graphic'?String(t.dueAt||'').startsWith('2026-09'):CARRIED.includes(t.id)):allWork;
  const scope=base.filter(t=>depts.includes(t.dept));
  const codes=depts.filter(c=>KPI[c]);
  const score=Math.round(codes.reduce((s,c)=>s+deptScore(c),0)/(codes.length||1));
  const done=scope.filter(t=>t.status==='done'),blocked=scope.filter(t=>t.status==='block');
  const overdue=scope.filter(t=>t._deadline!==false&&dashboardIsOverdue(t)),open=scope.filter(t=>t.status!=='done');
  const company=depts.length>1;
  const unit=REP_DEPT?(REP_DEPT==='MKT'?'การตลาด + Graphic Production':reportingDeptName(REP_DEPT)):REP_GROUP?('กลุ่ม '+GROUP_NAME[REP_GROUP]):(!isExec?reportingDeptName(currentDept()):'ภาพรวมบริษัท');
  const monthLabel=REP_MONTH==='09'?'กันยายน 2569':'สิงหาคม 2569';
  const d={isExec,depts,dept:depts[0],scope,codes,score,done,blocked,overdue,open,unit,company,monthLabel};
  d.dHighlight='ปิดงานสำเร็จ '+done.length+' งาน · คะแนน KPI รวม '+score+'/100 ('+scoreLabel(score)+')';
  d.dUrgent=blocked.length?blocked.map(t=>t.title).join(' · '):'ไม่มี';
  d.dDecision=overdue.length?('งานเกินกำหนด '+overdue.length+' รายการ ขอแนวทาง/ทรัพยากรเพิ่ม'):'—';
  d.dSupportOther='ประสานข้อมูล/ทรัพยากรตามงานที่ติดปัญหา';
  d.dSupportExec=(overdue.length||blocked.length)?'อนุมัติแนวทางแก้ไข/ทรัพยากรเพิ่มเติม':'—';
  return d;
}
const gyrScore=s=>{const g=s>=90?['Green','var(--green)']:s>=75?['Yellow','var(--amber)']:['Red','var(--red)'];return '<span class="gyr" style="background:'+g[1]+'">'+g[0]+'</span>';};
const gyrKpi=pc=>{const g=pc>=100?['Green','var(--green)']:pc>=85?['Yellow','var(--amber)']:['Red','var(--red)'];return '<span class="gyr" style="background:'+g[1]+'">'+g[0]+'</span>';};
function mKpiRows(d,exp){return d.company
  ? d.codes.map(c=>{const s=deptScore(c);const g=s>=95?'Green':s>=80?'Yellow':'Red';return `<tr><td>${deptName(c)}</td><td>—</td><td>${s==null?'รอรับรอง':s+'/100'}</td><td>${exp?g:gyrScore(s)}</td><td>${scoreLabel(s,c)}</td></tr>`;}).join('')
  : (KPI[d.dept]?KPI[d.dept].map(k=>{const g=k.pct>=95?'Green':k.pct>=80?'Yellow':'Red';return `<tr><td>${k.n}</td><td>${k.tg}</td><td>${acDisp(k)}</td><td>${exp?g:gyrKpi(k.pct)}</td><td>${kpiStatus(k.pct).t}</td></tr>`;}).join(''):'<tr><td colspan="5">—</td></tr>');}
function mMile(d){return d.done.length?d.done.map((t,i)=>`<tr><td>${i+1}</td><td>${t._source==='graphic'?`G-${t.jobNo} · `:''}${t.title}</td><td>${t.solution?t.solution.slice(0,70):(t._source==='graphic'?'Graphic Production ส่งมอบแล้ว':'สำเร็จตามเป้า')}</td><td>เสร็จ</td></tr>`).join(''):'<tr><td colspan="4">—</td></tr>';}
function mProb(d){const rows=[...d.blocked,...d.overdue.filter(t=>t.status!=='block')];return rows.length?rows.map((t,i)=>`<tr><td>${i+1}</td><td>${t.title}</td><td>${t.desc?t.desc.slice(0,55):'อยู่ระหว่างวิเคราะห์'}</td><td>${t.prio==='high'?'สูง':'ปานกลาง'}</td><td>${t.status==='block'?'Red':'Yellow'}</td></tr>`).join(''):'<tr><td colspan="5">ไม่มี</td></tr>';}
function mAct(d){const meeting=IMPLEMENTATION_ACTIONS.filter(a=>a.status!=='done'&&(!a.department_code||d.depts.includes(a.department_code)));const work=d.open.slice(0,Math.max(0,20-meeting.length));const rows=[...meeting.map(a=>({title:`${a.id} · ${a.title}`,owner:a.owner_label,due:a.due_date,status:(ACTION_STATUS[a.status]||ACTION_STATUS.not_started).t})),...work.map(t=>({title:(t._source==='graphic'?`G-${t.jobNo} · `:'')+t.title,owner:workOwner(t),due:t.due?fmtDate(t.due):'—',status:STATUS[t.status].t}))];return rows.length?rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.title)}</td><td>${esc(r.owner)}</td><td>${esc(r.due)}</td><td>${esc(r.status)}</td></tr>`).join(''):'<tr><td colspan="5">—</td></tr>';}
function mNext(d){const r=d.scope.filter(t=>t.status==='todo').slice(0,10);return r.length?r.map((t,i)=>`<tr><td>${i+1}</td><td>${t._source==='graphic'?`G-${t.jobNo} · `:''}${t.title}</td><td>${workOwner(t)}</td><td>${t.due?fmtDate(t.due):'—'}</td></tr>`).join(''):'<tr><td colspan="4">กำหนดในที่ประชุม</td></tr>';}
function repFilterBar(){const opt=(cur,v,txt)=>`<option value="${v}" ${cur===v?'selected':''}>${txt}</option>`;

const ACTION_STATUS={not_started:{t:'ยังไม่เริ่ม',c:'var(--muted)'},in_progress:{t:'กำลังทำ',c:'var(--sky)'},review:{t:'รอตรวจ',c:'var(--amber)'},blocked:{t:'ติดปัญหา',c:'var(--red)'},done:{t:'เสร็จ',c:'var(--green)'}};
function trackerStatus(t){const m=ACTION_STATUS[t.status]||ACTION_STATUS.not_started;if(t.status!=='done'&&t.due_date<new Date().toISOString().slice(0,10))return['เกินกำหนด','var(--red)'];return[m.t,m.c];}
function trackerRows(){return IMPLEMENTATION_ACTIONS.filter(t=>{const head=/Lead|Head|หัวหน้า|Admin|Executive/i.test(t.owner_label||'');return (!TRACK_MONTH||String(t.due_date||'').slice(5,7)===TRACK_MONTH)&&(!TRACK_GROUP||deptGroup(t.department_code)===TRACK_GROUP)&&(!TRACK_DEPT||t.department_code===TRACK_DEPT)&&(!TRACK_LEVEL||(TRACK_LEVEL==='head'?head:!head));});}
function actionDaysOver(t){if(t.status==='done')return 0;const due=new Date(t.due_date+'T23:59:59+07:00'),now=new Date();return due<now?Math.ceil((now-due)/86400000):0;}

async function saveImplementationAction(id){if(!SB)return;const a=IMPLEMENTATION_ACTIONS.find(x=>x.id===id);if(!a||!canManageImplementationAction(a))return;const status=val('iaStatus'),evidence=val('iaEvidence').trim();try{const r=await SB.from('implementation_actions').update({status,evidence}).eq('id',id).select().single();if(r.error)throw r.error;Object.assign(a,r.data);closeModal();RENDER.tracker();toast('บันทึก '+id+' แล้ว');}catch(e){toast('บันทึกไม่สำเร็จ · '+(e.message||''),'info');}}

const ACCESS_ROLE_LABEL={staff:'พนักงาน',lead:'หัวหน้างาน',exec:'ผู้บริหาร',admin:'ผู้ดูแลระบบ'};

function accessPolicyFor(id){return ACCESS_POLICIES.find(x=>x.profile_id===id)||{profile_id:id,enforce_device:false,enforce_ip:false,session_minutes:5};}
function accessDevicesFor(id){return ACCESS_DEVICES.filter(x=>x.profile_id===id);}
function accessIpRulesFor(id){return ACCESS_IP_RULES.filter(x=>x.profile_id===id&&x.active);}

function accessSecuritySummary(id){const p=accessPolicyFor(id),approved=accessDevicesFor(id).filter(x=>x.status==='approved').length,pending=accessDevicesFor(id).filter(x=>x.status==='pending').length,ips=accessIpRulesFor(id).length;if(!p.enforce_device&&!p.enforce_ip)return 'ยังไม่บังคับ';return `${p.enforce_device?'เครื่อง '+approved+(pending?' · รอ '+pending:''):'ไม่ล็อกเครื่อง'} · ${p.enforce_ip?'IP '+ips:'ไม่ล็อก IP'}`;}

function accessDepartmentChecks(prefix,selected=[],managed=[]){return DEPTS.map(d=>`<label style="display:flex;gap:7px;align-items:center;font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:8px"><input type="checkbox" data-access-visible="${prefix}" value="${d.code}" ${selected.includes(d.code)?'checked':''}> <span style="flex:1">${esc(d.name)}</span><input type="checkbox" data-access-manage="${prefix}" value="${d.code}" ${managed.includes(d.code)?'checked':''} title="หัวหน้าจัดการแผนกนี้"> <small>จัดการ</small></label>`).join('');}
function selectedAccessValues(attr,prefix){return [...document.querySelectorAll(`[${attr}="${prefix}"]:checked`)].map(x=>x.value);}
function syncAccessRoleForm(prefix){const role=val(prefix+'Role');const primary=val(prefix+'Dept');const manage=document.querySelectorAll(`[data-access-manage="${prefix}"]`);manage.forEach(x=>{x.disabled=role!=='lead';if(role!=='lead')x.checked=false;});const primaryVisible=document.querySelector(`[data-access-visible="${prefix}"][value="${primary}"]`);if(primaryVisible){primaryVisible.checked=true;primaryVisible.disabled=true;}document.querySelectorAll(`[data-access-visible="${prefix}"]`).forEach(x=>{if(x.value!==primary)x.disabled=role==='exec'||role==='admin';if(role==='exec'||role==='admin')x.checked=true;});}
async function loadAccessUsers(force=false){
  if(!SB||!canAdminAccess()||ACCESS_USERS_LOADING||ACCESS_USERS_READY&&!force)return;

    const [profiles,depts,policies,devices,ips]=await Promise.all([SB.from('profiles').select('id,email,display_name,position_title,role,department_code,active,created_at,updated_at').order('display_name'),SB.from('profile_departments').select('profile_id,department_code,can_manage'),SB.from('user_access_policies').select('profile_id,enforce_device,enforce_ip,session_minutes,updated_at'),SB.from('user_access_devices').select('id,profile_id,device_label,status,first_seen_ip,last_seen_ip,first_seen_at,last_seen_at,approved_at').order('last_seen_at',{ascending:false}),SB.from('user_access_ip_rules').select('id,profile_id,allowed_network,label,active').eq('active',true)]);
    if(profiles.error)throw profiles.error;if(depts.error)throw depts.error;

    ACCESS_USERS=profiles.data||[];ACCESS_USER_DEPTS=depts.data||[];ACCESS_POLICIES=policies.data||[];ACCESS_DEVICES=devices.data||[];ACCESS_IP_RULES=ips.data||[];ACCESS_USERS_READY=true;

async function saveAccessUser(id){
  const btn=document.getElementById('saveAccessBtn');if(btn.disabled)return;
  const securityOnly=btn.dataset.section==='security';
  let name,args;

    const enforceDevice=document.getElementById('editUserEnforceDevice').checked,enforceIp=document.getElementById('editUserEnforceIp').checked;
    const ipRules=val('editUserIpRules').split(/\n|,/).map(x=>x.trim()).filter(Boolean);
    if(enforceDevice&&!accessDevicesFor(id).some(x=>x.status==='approved')){toast('ต้องอนุมัติอย่างน้อย 1 เครื่องก่อนเปิดล็อกเครื่อง','info');return;}
    if(enforceIp&&!ipRules.length){toast('ต้องระบุ IP/CIDR ก่อนเปิดล็อก IP','info');return;}
    name='set_user_login_policy';args={target_user:id,new_enforce_device:enforceDevice,new_enforce_ip:enforceIp,new_session_minutes:Number(val('editUserSessionMinutes')),allowed_cidrs:ipRules};
  }else{
    const position=normSp(val('editUserPosition'));if(!position){toast('กรุณาระบุตำแหน่งงาน','info');return;}
    name='set_user_access';args={target_user:id,new_role:val('editUserRole'),new_primary_department:val('editUserDept'),visible_departments:selectedAccessValues('data-access-visible','editUser'),managed_departments:selectedAccessValues('data-access-manage','editUser'),new_active:document.getElementById('editUserActive').checked,new_position_title:position};
  }
  if(!confirm(securityOnly?'ยืนยันการเปลี่ยนเครื่องและ IP ของบัญชีนี้?':'ยืนยันการเปลี่ยนแผนก หน้าที่ และสิทธิ์ของบัญชีนี้?'))return;
  btn.disabled=true;
  try{const r=await SB.rpc(name,args);if(r.error)throw r.error;

  }catch(e){btn.disabled=false;toast('บันทึกไม่สำเร็จ · '+(e.message||''),'info');}
}

function ask(q){
  if(!q||!q.trim())return;
  const body=document.getElementById('chatBody'),inp=document.getElementById('chatInput');if(inp)inp.value='';
  body.insertAdjacentHTML('beforeend',`<div class="msg u">${q}</div>`);
  let ans='';
  if(/กิจกรรม|ชั่วโมง|พนักงาน.*ทำ|ใครทำ|activity|บันทึกงาน/.test(q)){
    ans=actAnswer(q);
  }else if(/ปัญหา|problem|เคส|incident|payment|callback|โปรเจกต์|ยังไม่แก้/.test(q)){
    ans=probAnswer(q);
  }else if(/kpi|เท่าไหร่|แผนก/.test(q)){
    ans=`<b>คะแนน KPI รายแผนก (เดือนนี้)</b><span class="q">SELECT dept, AVG(score) FROM kpi_records WHERE month='2026-08' GROUP BY dept</span>
      <table class="datatable" style="width:100%"><tr><th>แผนก</th><th>คะแนน</th></tr>
      ${Object.keys(KPI).map(c=>`<tr><td>${deptName(c)}</td><td style="color:${scoreColor(deptScore(c))}">${deptScore(c)}/100</td></tr>`).join('')}</table>`;
  }else if(/ติดปัญหา|block|ค้าง/.test(q)){
    const b=TASKS.filter(t=>t.status==='block'||t.status==='review');
    ans=`<b>งานที่ต้องจับตา (ติดปัญหา/รอตรวจ) มี ${b.length} งาน</b><span class="q">SELECT * FROM tasks WHERE status IN ('block','review')</span>
      ${b.map(t=>`• <b>${t.id}</b> ${t.title} — ${STATUS[t.status].t} (${deptName(t.dept)})`).join('<br>')}`;
  }else if(/ตรงเวลา|กราฟิก|graphic/.test(q)){
    ans=`แผนกกราฟิกส่งงานตรงเวลา <b style="color:var(--amber)">84%</b> (เป้า ≥90%) ต่ำกว่าเป้าเล็กน้อย<span class="q">SELECT on_time_rate FROM kpi WHERE dept='GRAPHIC'</span>สาเหตุหลักจากงานเร่งแทรกและแก้หลายรอบ — มีวิธีลดใน KB-05`;
  }else{ans=`พบข้อมูลที่เกี่ยวข้องในระบบ ${TASKS.length} งาน และ ${KB.length} บทความความรู้<span class="q">SELECT ... FROM internal_db /* ข้อมูลภายในเท่านั้น */</span>ลองถามเจาะจง เช่น "งานของ CRM วันนี้"`;}
  setTimeout(()=>{body.insertAdjacentHTML('beforeend',`<div class="msg a">${ans}</div>`);body.scrollTop=body.scrollHeight;},250);
  body.scrollTop=body.scrollHeight;
}

ask=async function(q,bodyId='chatBody',inputId='chatInput'){
  q=String(q||'').trim();if(!q)return;const body=document.getElementById(bodyId),inp=document.getElementById(inputId);if(!body)return;if(inp)inp.value='';

  const prior=TALK_HISTORY.slice(-8);TALK_HISTORY.push({role:'user',content:q});
  try{
    if(!SB||!SB.functions)throw new Error('ยังไม่ได้เชื่อมต่อ AI backend');
    const result=await SB.functions.invoke('talk-to-data',{body:{question:q,view:VIEW,filters:talkCurrentFilters(),history:prior}});
    if(result.error)throw result.error;if(!result.data||result.data.error)throw new Error((result.data&&result.data.error)||'AI ไม่ส่งคำตอบกลับมา');
    const a=result.data.answer||{},section=(title,rows)=>Array.isArray(rows)&&rows.length?`<div style="margin-top:9px"><b>${title}</b><ul>${rows.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'';
    const node=document.getElementById(loadingId);if(node)node.innerHTML=`<div>${esc(a.answer||'ไม่พบคำตอบจาก AI')}</div>${section('ข้อมูลเชิงลึก',a.insights)}${section('ข้อเสนอแนะ',a.recommendations)}${section('ข้อจำกัดของข้อมูล',a.caveats)}${Array.isArray(a.sources)?a.sources.map(s=>`<span class="tag">${esc(s)}</span>`).join(''):''}`;
    TALK_HISTORY.push({role:'assistant',content:String(a.answer||'').slice(0,1800)});
  }catch(error){
    const node=document.getElementById(loadingId);if(node)node.innerHTML=`${talkRuleAnswer(q)}<span class="q">ใช้คำตอบสำรองจากข้อมูลในหน้าเว็บ · ${esc(error&&error.message?error.message:'ลองใหม่')}</span>`;
  }
  TALK_HISTORY=TALK_HISTORY.slice(-16);body.scrollTop=body.scrollHeight;
};

const ISSUE_DEFAULT_OWNER={Payment:'Payment',Website:'IT',System:'IT',Customer:'Admin',Network:'IT',Provider:'Support',Other:'Admin'};
let PF={project:'',cat:'',prio:'',status:'',solution:'',quality:'',q:''};
function setPF(k,v){PF[k]=(PF[k]===v?'':v);RENDER.problems();}
function clearPF(){PF={project:'',cat:'',prio:'',status:'',solution:'',quality:'',q:''};RENDER.problems();}
function probPrio(p){const m=PROB_PRIO[p]||{t:p,c:'#888'};return `<span class="tag" style="background:${m.c}22;color:${m.c};border-color:${m.c}55">${m.t}</span>`;}
function probStatus(s){const m=PROB_ST[s]||{t:s,c:'#888'};return `<span class="tag" style="background:${m.c}22;color:${m.c};border-color:${m.c}55">${m.t}</span>`;}
function probDate(d){return d?d.split('-').reverse().join('/'):'-';}
function probResT(m){if(m==null||m==='')return '-';if(m<60)return Math.round(m)+' น.';const h=m/60;return (h>=100?Math.round(h):h.toFixed(1))+' ชม.';}

function probCause(p){
  if(p.rootCause)return p.rootCause;
  const s=((p.cat||'')+' '+(p.problem||'')).toLowerCase();
  if(/ปิดปรับปรุง|ปิดให้บริการ|ยอดเต็ม|provider|ผู้ให้บริการ|ธนาคารปิด/.test(s))return 'ผู้ให้บริการ / ช่องทางปิด';
  if(/ฝาก|ถอน|payment|callback|ออโต้|อัตโนมัติ|timeout/.test(s))return 'ธุรกรรมไม่เข้าอัตโนมัติ';
  if(/ยอดเงิน|ยอดหาย|เงินไม่เข้า|รายการลูกค้า|เดิมพัน/.test(s))return 'ยอดเงิน / รายการลูกค้า';

  return p.cat||'อื่น ๆ';
}

async function saveIssueFollowup(id){

function probAnswer(q){

  else if(/system|ระบบ|callback/.test(s)){list=list.filter(p=>p.cat==='System');parts.push('หมวด System');}

  if(/แนวทางแก้|วิธีแก้|แก้อย่างไร|solution/.test(s)){const rows=probGroup(list,probApproach).slice(0,8),withSolution=list.filter(hasIssueSolution).length;return `<b>แนวทางแก้จาก ${nf(list.length)} เคส</b><table class="datatable" style="width:100%;margin-top:8px"><tr><th>แนวทาง</th><th>เคส</th></tr>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${nf(v.length)}</td></tr>`).join('')}</table><div style="margin-top:8px">มีวิธีแก้ ${nf(withSolution)} เคส · ยังขาด ${nf(list.length-withSolution)} เคส</div>`;}
  const open=list.filter(p=>p.status!=='Resolved').length, res=list.filter(p=>p.status==='Resolved').length;
  const avg=probAvgHrs(list);

  const title=parts.length?('ปัญหา ('+parts.join(' · ')+')'):'สรุปปัญหาทั้งหมด';
  return `<b>${title}: ${list.length} เคส</b> · ยังไม่แก้ ${open} · แก้แล้ว ${res} · เวลาแก้เฉลี่ย ${avg.toFixed(1)} ชม.

function actBars(pairs,click,colorFn){const max=Math.max(1,...pairs.map(x=>x[1]));return pairs.map(([k,v])=>`<div class="kpirow" style="grid-template-columns:150px 1fr 42px;cursor:pointer" onclick="${click(k)}"><div class="nm" style="font-size:12px">${k}</div><div class="bar"><i style="width:${Math.round(v/max*100)}%;background:${colorFn?colorFn(k):'#2563eb'}"></i></div><div class="score" style="font-size:12px">${v}</div></div>`).join('');}
RENDER.activity=function(){
  const all=ACTS,list=actFiltered();
  const hours=Math.round(actHours(all));
  const people=new Set(all.map(a=>a.e).filter(Boolean)).size;
  const days=new Set(all.map(a=>a.d).filter(Boolean)).size;
  const flagged=all.filter(a=>a.tf!=='ok').length;
  const deptKey=a=>a.dp;
  const dcolor=k=>{const a=all.find(x=>x.dp===k);return a?ACT_GC[a.g]:'#2563eb';};
  const scolor=k=>ACT_ST[k]||'#2563eb';
  const topEmp=Object.entries(all.reduce((o,a)=>{if(a.e){o[a.e]=o[a.e]||{c:0,h:0};o[a.e].c++;o[a.e].h+=(typeof a.du==='number'?a.du:0);}return o;},{})).map(([k,v])=>[k,v]).sort((x,y)=>y[1].h-x[1].h).slice(0,8);

  main.innerHTML=`${crumb('หน้าแรก','บันทึกกิจกรรม')}

    <div style="display:flex;gap:8px"><button class="tbtn" onclick="openTalkPopup('สรุปกิจกรรมและชั่วโมงที่นับได้')">${sic('i-chat')} ถาม AI เรื่องกิจกรรม</button></div></div>
  <div class="stats" style="margin-bottom:14px">
    <div class="stat accent click" onclick="clearAF()"><div class="lbl">กิจกรรมทั้งหมด</div><div class="val">${all.length}</div><div class="sub">ทุกแผนก</div><div class="icn">${sic('i-check')}</div></div>
    <div class="stat"><div class="lbl">ชั่วโมงรวม (คำนวณได้)</div><div class="val">${hours}</div><div class="sub muted">เฉพาะแถวเวลาถูกต้อง</div></div>
    <div class="stat"><div class="lbl">จำนวนพนักงาน</div><div class="val">${people}</div><div class="sub muted">${days} วันที่มีข้อมูล</div></div>
    <div class="stat click" onclick="setAF('flag','all')"><div class="lbl">ต้องตรวจเวลา</div><div class="val" style="color:var(--amber)">${flagged}</div><div class="sub muted">เวลาแปลง/กำกวม</div></div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:14px">
    <div class="card"><div class="card-h"><h3>${sic('i-board')} กิจกรรมตามแผนก</h3><span class="act">คลิกเพื่อกรอง</span></div><div class="pad">${actBars(actCounts(all,'dp'),k=>`setAF('dept','${k.replace(/'/g,"")}')`,dcolor)}</div></div>
    <div class="card"><div class="card-h"><h3>${sic('i-users')} พนักงาน (ชั่วโมงสูงสุด)</h3><span class="act">Top 8</span></div><div class="pad">${topEmp.map(([k,v])=>`<div class="kpirow" style="grid-template-columns:120px 1fr 64px"><div class="nm" style="font-size:12px">${k}</div><div class="bar"><i style="width:${Math.round(v.h/empMax*100)}%;background:#2158c8"></i></div><div class="score" style="font-size:11.5px">${Math.round(v.h)}ชม./${v.c}</div></div>`).join('')}</div></div>
  </div>
  <div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:14px">
    <div class="card"><div class="card-h"><h3>${sic('i-pie')} ตามประเภทงาน</h3></div><div class="pad">${actBars(actCounts(all,'c'),k=>`clearAF()`,k=>'#0b7a75')}</div></div>
    <div class="card"><div class="card-h"><h3>${sic('i-check')} ตามสถานะ</h3></div><div class="pad">${actBars(actCounts(all,'s'),k=>`setAF('status','${k.replace(/'/g,"")}')`,scolor)}</div></div>
  </div>

    <div class="pad" style="display:flex;gap:8px;flex-wrap:wrap;align-items:end;border-bottom:1px solid var(--line-2)">
      <div class="fsel"><label>แผนก</label><select onchange="AF.dept=this.value;RENDER.activity()">${opt(AF.dept,'','ทั้งหมด')}${depts.map(v=>opt(AF.dept,v,v)).join('')}</select></div>
      <div class="fsel"><label>สถานะ</label><select onchange="AF.status=this.value;RENDER.activity()">${opt(AF.status,'','ทั้งหมด')}${Object.keys(ACT_ST).map(v=>opt(AF.status,v,v)).join('')}</select></div>
      <div class="fsel" style="flex:1;min-width:160px"><label>ค้นหา</label><input class="fin" value="${AF.q}" placeholder="ค้นหากิจกรรม / ชื่อ" oninput="AF.q=this.value;clearTimeout(window._afq);window._afq=setTimeout(RENDER.activity,250)"></div>
