<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Company Hub — ระบบศูนย์รวมงานองค์กร (Prototype v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue-900:#0b2a6b; --blue-800:#123a86; --blue-700:#1a49a6; --blue-600:#2158c8;
  --blue-500:#2f6fe0; --blue-400:#5b8ff0; --blue-100:#e7effc; --blue-50:#f2f6fd;
  --primary:#2158c8; --primary-d:#123a86;
  --ink:#182338; --muted:#67769a; --line:#e4eaf3; --line-2:#eef2f9; --bg:#f4f7fc; --white:#ffffff; --surface:#ffffff;
  --gray:#b7c0d0; --green:#00a878; --amber:#e8971b; --red:#e2445c; --sky:#2f8fe6; --purple:#7a53e0;
  --radius:12px; --shadow:0 2px 10px rgba(20,58,134,.06); --shadow-lg:0 12px 40px rgba(20,58,134,.18);
}
body.dark{
  --bg:#0e1626; --white:#16213a; --surface:#16213a; --ink:#e8eef8; --muted:#93a1bf;
  --line:#28344f; --line-2:#1f2b44; --blue-50:#1b2942; --blue-100:#26385c;
  --blue-700:#9cc0ff; --blue-400:#3f74d8; --shadow:0 2px 10px rgba(0,0,0,.35); --shadow-lg:0 14px 40px rgba(0,0,0,.5);
}
body.dark .ai-note,body.dark .exec-summary{background:linear-gradient(120deg,#1b2942,#173430);border-color:#28344f}
body.dark .pin{background:linear-gradient(90deg,#1b2942,var(--surface))}
body.dark .stbtn.active{color:#fff}
body.dark .brandbar{filter:brightness(.9)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Kanit','Noto Sans Thai','Leelawadee UI','Sarabun',sans-serif;background:var(--bg);color:var(--ink);font-weight:300;font-size:13.5px;word-break:break-word;overflow-wrap:break-word;line-break:auto;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font-family:inherit;font-size:inherit}
.nowrap{white-space:nowrap}
td,.tile h4,.ann h4,.msg{word-break:break-word;overflow-wrap:break-word;line-break:auto}
button{cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cdd8ea;border-radius:8px}

/* Layout */
.app{display:grid;grid-template-columns:248px 1fr;grid-template-rows:58px 1fr;height:100vh;grid-template-areas:"logo top" "side main"}
.topbar{grid-area:top;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;z-index:20}
.brandbar{grid-area:logo;background:linear-gradient(160deg,var(--blue-800),var(--blue-600));display:flex;align-items:center;gap:10px;padding:0 18px;color:#fff}
.brandbar .logo{width:32px;height:32px;border-radius:9px;background:#fff;color:#123a86;display:grid;place-items:center;font-weight:700;font-size:17px}
.brandbar b{font-weight:600;font-size:15.5px;letter-spacing:.2px}
.brandbar span{font-size:10.5px;opacity:.8;display:block;font-weight:300;margin-top:-3px}
.sidebar{grid-area:side;background:linear-gradient(180deg,var(--blue-800),var(--blue-900));color:#dfe8fb;padding:12px 12px;overflow-y:auto}
.main{grid-area:main;overflow-y:auto;padding:18px 24px 60px}

/* Topbar */
.search{flex:1;max-width:380px;position:relative}
.search input{width:100%;padding:8px 14px 8px 36px;border:1px solid var(--line);border-radius:9px;background:var(--blue-50);font-size:13px}
.search::before{content:"🔍";position:absolute;left:11px;top:7px;opacity:.5;font-size:12px}
.roleswitch{display:flex;background:var(--blue-50);border:1px solid var(--line);border-radius:9px;padding:3px}
.roleswitch button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:12px;color:var(--muted);font-weight:400}
.roleswitch button.active{background:var(--primary);color:#fff}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:12.5px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.tbtn:hover{border-color:var(--blue-400)}
.tbtn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.tbtn.sm{padding:5px 9px;font-size:11.5px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue-600);color:#fff;display:grid;place-items:center;font-weight:500;font-size:13px}

/* Sidebar */
.side-user{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;background:rgba(255,255,255,.08);margin-bottom:12px}
.side-user .avatar{background:#fff;color:#123a86}
.side-user small{display:block;opacity:.7;font-size:10.5px}
.navgroup{font-size:10px;text-transform:uppercase;letter-spacing:.8px;opacity:.5;margin:12px 10px 5px}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:#dfe8fb;font-size:13px;font-weight:300;margin-bottom:2px;border:0;background:transparent;width:100%;text-align:left}
.navitem:hover{background:rgba(255,255,255,.09)}
.navitem.active{background:var(--primary);color:#fff;font-weight:400}
.navitem .ic{width:19px;text-align:center;font-size:14px}
.navitem .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 7px;border-radius:20px}

/* Header + breadcrumb */
.crumb{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.crumb b{color:var(--blue-700);font-weight:500}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.page-h h1{font-size:22px;font-weight:600}
.page-h p{color:var(--muted);font-size:12.5px;font-weight:300;margin-top:2px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.card-h h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-h .act{font-size:11.5px;color:var(--muted)}
.pad{padding:16px}
.grid{display:grid;gap:14px}
.hide{display:none!important}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;color:#fff;font-weight:400;white-space:nowrap}
.tag{display:inline-block;padding:2px 9px;border-radius:6px;background:var(--blue-100);color:var(--blue-700);font-size:10.5px;margin:2px 3px 2px 0;font-weight:400}
.muted{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Stat tiles */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative}
.stat .lbl{color:var(--muted);font-size:11.5px}
.stat .val{font-size:26px;font-weight:600;margin-top:3px;letter-spacing:-.5px}
.stat .sub{font-size:11px;margin-top:2px}
.stat .icn{position:absolute;right:13px;top:13px;font-size:19px;opacity:.22}
.up{color:var(--green)} .down{color:var(--red)}
.stat.accent{background:linear-gradient(150deg,var(--blue-700),var(--blue-500));color:#fff;border:0}
.stat.accent .lbl,.stat.accent .sub{color:rgba(255,255,255,.85)}
.stat.click{cursor:pointer;transition:.12s}
.stat.click:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--blue-400)}
.stat.accent.click:hover{filter:brightness(1.06)}
.stat .go{position:absolute;right:12px;bottom:9px;font-size:10.5px;color:var(--blue-600);opacity:0;transition:.12s;font-weight:400}
.stat.accent .go{color:#fff}
.stat.click:hover .go{opacity:.95}
.hlink{cursor:pointer}
.hlink:hover{background:var(--blue-50);border-radius:6px}
.legrow{cursor:pointer;border-radius:7px;padding:3px 6px!important}
.legrow:hover{background:var(--blue-50)}

/* Bars & KPI rows */
.bar{height:8px;background:var(--blue-50);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px}
.kpirow{display:grid;grid-template-columns:170px 1fr 78px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line-2)}
.kpirow:last-child{border-bottom:0}
.kpirow .nm{font-size:12.5px} .kpirow .nm small{display:block;color:var(--muted);font-size:10.5px}
.score{font-weight:600;text-align:right;font-size:13px}
/* KPI item อ่านง่าย */
.kpi-item{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line-2)}
.kpi-item:last-child{border-bottom:0}
.kpi-icn{width:28px;height:28px;border-radius:9px;color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0}
.kpi-name{font-size:13px;font-weight:500;line-height:1.35}
.kpi-val{font-size:12px}
.kpi-val b{font-size:14px}
.kpi-edit{margin-top:6px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi-edit input{width:66px;padding:4px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:600;text-align:right}
.kpi-edit input:focus{outline:2px solid var(--accent);border-color:var(--accent)}

/* Horizontal magnitude bars (charts) */
.hbar{display:grid;grid-template-columns:130px 1fr 46px;gap:10px;align-items:center;padding:5px 0;font-size:12px}
.hbar .track{height:20px;background:var(--blue-50);border-radius:5px;overflow:hidden}
.hbar .track>i{display:block;height:100%;background:var(--primary);border-radius:5px;min-width:3px}
.hbar .num{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}

/* Legend */
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:11.5px;margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Filter toolbar */
.filterbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow);margin-bottom:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.filterbar .fsearch{position:relative;flex:1;min-width:180px}
.filterbar .fsearch input{width:100%;padding:7px 12px 7px 30px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:var(--blue-50)}
.filterbar .fsearch::before{content:"🔍";position:absolute;left:10px;top:6px;opacity:.45;font-size:11px}
.fsel{display:flex;align-items:center;gap:5px;font-size:12px}
.fsel select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:12px;background:var(--surface);color:var(--ink)}
.fsel label{color:var(--muted);font-size:11px}
.fdiv{width:1px;height:24px;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-100);color:var(--blue-700);padding:4px 10px;border-radius:20px;font-size:11.5px;border:0}
.fchip b{font-weight:500}
.fchip .rm{cursor:pointer;opacity:.6;font-weight:600}
.fchip .rm:hover{opacity:1}
.resultline{font-size:11.5px;color:var(--muted);margin:2px 0 10px}

/* Table (Monday board) */
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.board-grp{padding:11px 15px 5px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:10.5px;color:var(--muted);font-weight:500;padding:8px 12px;background:var(--blue-50);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px;cursor:pointer;user-select:none}
thead th:hover{color:var(--blue-700)}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line-2);font-size:12.5px;vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--blue-50)}
.trow-lead{border-left:3px solid var(--red)}
.people{display:flex;align-items:center;gap:6px}
.mini{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;color:#fff;font-weight:500;flex-shrink:0}
tfoot td{padding:9px 12px;font-size:11.5px;font-weight:500;background:var(--blue-50);border-top:1px solid var(--line);color:var(--muted)}

/* Timeline */
.tl-row{display:grid;grid-template-columns:210px 1fr;gap:10px;align-items:center;padding:6px 0}
.tl-track{position:relative;height:24px;background:var(--blue-50);border-radius:7px}
.tl-bar{position:absolute;height:24px;border-radius:7px;color:#fff;font-size:10.5px;display:flex;align-items:center;padding:0 8px;white-space:nowrap;overflow:hidden}
.tl-scale{display:grid;grid-template-columns:repeat(10,1fr);font-size:10px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:6px}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--blue-400)}
.tile h4{font-size:14px;font-weight:600;margin-bottom:5px}
.tile .meta{font-size:11px;color:var(--muted)}

/* Announcements / feed */
.ann{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.ann:last-child{border:0}
.ann .who{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:600;flex-shrink:0}
.ann h4{font-size:13.5px;font-weight:600}
.ann .body{font-size:12.5px;color:#43506e;margin-top:3px;font-weight:300}
.ann .time{font-size:10.5px;color:var(--muted);margin-top:4px}
.pin{background:linear-gradient(90deg,var(--blue-50),#fff);border-left:3px solid var(--amber);padding-left:12px}
.feed-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line-2);font-size:12.5px}
.feed-item .fi{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;font-size:13px}

/* Reports */
.rep-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.seg{display:inline-flex;background:var(--blue-50);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:7px;font-size:12px;color:var(--muted);font-weight:400}
.seg button.active{background:var(--primary);color:#fff}
.exec-summary{background:linear-gradient(120deg,#f2f6fd,#eef7f3);border:1px solid var(--blue-100);border-radius:var(--radius);padding:16px 18px;font-size:13px;line-height:1.75;font-weight:300}
/* Monthly report form */
.rpt{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:26px 30px;max-width:920px;margin:0 auto}
.rpt h2{font-size:18px;text-align:center;font-weight:600}
.rpt .rsub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:14px}
.rpt h3{font-size:14px;font-weight:600;margin:18px 0 8px;border-left:4px solid var(--primary);padding-left:9px}
.rpt table{width:100%;border-collapse:collapse;margin-top:4px}
.rpt th,.rpt td{border:1px solid var(--line);padding:6px 9px;font-size:12px;text-align:left;vertical-align:top}
.rpt th{background:var(--blue-50);font-weight:500}
.rpt .rmeta{display:grid;grid-template-columns:1fr 1fr;gap:5px 24px;font-size:12.5px;margin:6px 0 4px}
.rpt .rmeta b{font-weight:500}
.gyr{display:inline-block;padding:1px 8px;border-radius:20px;color:#fff;font-size:11px;font-weight:500}
.rbox{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;margin:4px 0;background:var(--blue-50)}
.exec-summary b{color:var(--blue-800);font-weight:500}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}

/* Chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:420px}
.chat-body{flex:1;overflow-y:auto;padding:6px 4px}
.msg{max-width:76%;padding:10px 14px;border-radius:13px;margin:7px 0;font-size:13px;line-height:1.55;font-weight:300}
.msg.u{background:var(--primary);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.msg.a{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a .q{font-family:monospace;font-size:11px;background:var(--blue-50);padding:6px 9px;border-radius:8px;color:var(--blue-800);margin:6px 0;display:block}
.chip{display:inline-block;background:var(--blue-50);border:1px solid var(--line);color:var(--blue-700);padding:6px 11px;border-radius:20px;font-size:12px;margin:4px 6px 0 0;cursor:pointer}
.chip:hover{background:var(--blue-100)}
.chat-in{display:flex;gap:10px;margin-top:10px}
.chat-in input{flex:1;padding:11px 15px;border:1px solid var(--line);border-radius:11px;font-size:13.5px}
.datatable td,.datatable th{padding:5px 9px;font-size:11.5px;border-bottom:1px solid var(--line-2);text-align:left}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(11,42,107,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--surface);border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:var(--surface);z-index:2}
.modal-h h3{font-size:17px;font-weight:600}
.x{border:0;background:var(--blue-50);width:32px;height:32px;border-radius:9px;font-size:17px;color:var(--muted)}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.field .v{font-size:13.5px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13px}
.kv .k{color:var(--muted)}
.step{display:flex;gap:10px;padding:6px 0;font-size:12.5px}
.step .n{width:21px;height:21px;border-radius:50%;background:var(--blue-100);color:var(--blue-700);display:grid;place-items:center;font-size:10.5px;flex-shrink:0;font-weight:500}
.ai-note{background:linear-gradient(120deg,#f2f6fd,#eaf7f2);border:1px solid var(--blue-100);border-radius:11px;padding:11px 13px;font-size:12.5px;margin-top:8px}
.ai-note b{color:var(--blue-700)}
textarea,select.fin,input.fin{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:var(--surface);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Toast */
#toast{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast-item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:10px;padding:11px 15px;box-shadow:var(--shadow-lg);font-size:12.5px;max-width:340px;transition:opacity .3s;animation:tin .25s ease}
.toast-item.info{border-left-color:var(--primary)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}
.checkbox{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.sub-item{display:flex;gap:10px;padding:7px 8px;font-size:12.5px;align-items:center;cursor:pointer;border-radius:8px;border:1px solid var(--line-2);margin-bottom:5px}
.sub-item:hover{background:var(--blue-50);border-color:var(--blue-400)}
.sub-item .cyc{margin-left:auto;font-size:10px;color:var(--muted);opacity:0}
.sub-item:hover .cyc{opacity:1}
/* Status buttons (segmented) */
.statusbtns{display:flex;flex-wrap:wrap;gap:6px}
.stbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:400;transition:.12s}
.stbtn:hover{border-color:var(--c);color:var(--c)}
.stbtn.active{background:var(--c);border-color:var(--c);color:#fff;font-weight:500;box-shadow:0 2px 8px color-mix(in srgb,var(--c) 40%,transparent)}
.logline{display:flex;gap:9px;padding:6px 0;font-size:12px;border-bottom:1px dashed var(--line-2)}
/* Voice */
#micBtn.listening{background:var(--red)!important;color:#fff!important;border-color:var(--red)!important;animation:pulse 1s infinite}

#hamb{display:none}
.scrim{display:none;position:fixed;inset:0;background:rgba(11,42,107,.4);z-index:55}

.orgrole{display:flex;align-items:center;gap:7px;font-size:11px;padding:3px 0;color:#42506e}
.execbox{background:linear-gradient(160deg,var(--blue-900),var(--blue-700));color:#fff;padding:12px 30px;border-radius:12px;text-align:center;box-shadow:var(--shadow)}

@media(max-width:640px){.orggrid{grid-template-columns:1fr}}

/* ===== KPI: คำนวณ Achievement จาก Actual/Target แล้วเก็บใน k.pct ===== */
function kpiAch(k){ return k.tgt!=null ? Math.round(k.ac / k.tgt * 100) : k.pct; }
function recalcKPI(){ Object.keys(KPI).forEach(c=>KPI[c].forEach(k=>{ if(k.tgt!=null) k.pct=kpiAch(k); })); }
/* ค่าที่แสดง (Actual) — ตัวชี้วัดจริงแสดงเป็น % */
const acDisp = k => k.tgt!=null ? k.ac+'%' : k.ac;
/* คะแนนรวมแผนก 0–100: มีน้ำหนัก → ถ่วงน้ำหนัก (Achievement เกิน 100 นับที่ 100) ; ไม่มีน้ำหนัก → เฉลี่ยเท่ากัน */
const deptScore = code => { const a=KPI[code]; if(!a)return null;
  if(a.every(k=>k.w!=null)) return Math.round(a.reduce((s,k)=>s+Math.min(k.pct,100)*k.w,0));
  return Math.round(a.reduce((s,k)=>s+Math.min(k.pct,100),0)/a.length); };
/* เกณฑ์ 5 ระดับ (เทียบ Target): ดีเยี่ยม ≥100 · ดีมาก 95–99.9 · ดี 90–94.9 · พอใช้ 80–89.9 · ต้องปรับปรุง <80 */

const nf=n=>Number(n).toLocaleString('th-TH');
/* เทมเพลตวันที่ไทย: '08-12' -> 'ศ. 12 ส.ค.' */
const THMON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const THDAY=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
function fmtDate(mmdd,withYear){
  if(!mmdd)return '-';const p=mmdd.split('-').map(Number);const m=p[0],d=p[1];
  const dt=new Date(2026,m-1,d);
  return THDAY[dt.getDay()]+' '+d+' '+THMON[m-1]+(withYear?' 69':'');
}
const normSp=s=>(s||'').replace(/\s+/g,' ').trim();
/* ระยะเวลาดำเนินการ (SLA) */
const DFROM=s=>new Date(2026,+s.split('-')[0]-1,+s.split('-')[1]);
const addFrom=(s,n)=>{const d=DFROM(s);d.setDate(d.getDate()+n);return ('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);};
const slaUnitTxt=un=>un==='hr'?'ชม.':'วัน';
const slaOf=t=>t.sla||{n:Math.max(1,Math.round((DFROM(t.due)-DFROM(t.start))/86400000)),unit:'day'};
const slaText=t=>{const s=slaOf(t);return s.n+' '+slaUnitTxt(s.unit);};
const slaOverdue=t=>{if(t.status==='done')return false;const s=slaOf(t);if(s.unit!=='day')return false;return addFrom(t.start,s.n)<TODAY_MMDD;};
const TODAY_MMDD='08-07';
function annStatus(a){if(a.until&&a.until<TODAY_MMDD)return{t:'หมดอายุ',c:'var(--gray)'};if(a.from&&a.from>TODAY_MMDD)return{t:'ยังไม่เริ่ม',c:'var(--amber)'};return{t:'กำลังใช้',c:'var(--green)'};}
function av(id,cls='mini'){const x=u(id);return `<span class="${cls}" style="background:${x.c}">${x.s}</span>`;}
const statusPill=s=>`<span class="pill" style="background:${STATUS[s].c}">${STATUS[s].t}</span>`;
const prioPill=p=>`<span class="pill" style="background:${PRIO[p].c}">${PRIO[p].t}</span>`;
const deptPill=c=>`<span class="pill" style="background:${deptColor(c)}">${deptName(c)}</span>`;
const shortName=id=>u(id).n.split(' (')[0];

/* ============================================================

============================================================ */
const ASSIGNABLE=['a','b','c','d','e','f','lead_gr','lead_crm','lead_mkt'];
const me=()=>ROLE_META[ROLE].u;
const annAudienceIds=a=>(a.audienceIds&&a.audienceIds.length)?a.audienceIds:ASSIGNABLE;
const nextAnnId=()=>'A'+(++ANN_SEQ);
function pendingAcks(){return ANN.filter(a=>annStatus(a).t!=='หมดอายุ'&&annAudienceIds(a).includes(me())&&!(a.acks||[]).includes(me()));}
function updateBell(){const el=document.getElementById('bell');if(!el)return;const n=pendingAcks().length;el.innerHTML='🔔'+(n?` <span style="background:var(--red);color:#fff;border-radius:20px;padding:0 6px;font-size:10px">${n}</span>`:'');}
function ackAnn(id){const a=ANN.find(x=>x.id===id);if(!a)return;a.acks=a.acks||[];
  if(!a.acks.includes(me())){a.acks.push(me());logFeed('✅','#e6f7f1',`<b>${shortName(me())}</b> รับทราบประกาศ: ${a.title}`);toast('รับทราบประกาศแล้ว');}
  updateBell();saveState();
  if(document.getElementById('ackpop')){ if(pendingAcks().length) showAckPopup(); else { closeModal(); if(VIEW==='ann')RENDER.ann(); } }
  else if(document.getElementById('anndetail')){ openAnn(id); }
  else if(VIEW==='ann')RENDER.ann();
}
function showAckPopup(manual){
  const list=pendingAcks();
  if(!list.length){ if(manual)toast('ไม่มีประกาศที่ต้องรับทราบ 🎉'); return; }
  showModal(`<div class="modal-h"><div><h3>🔔 ประกาศที่ต้องรับทราบ (${list.length})</h3><div class="muted" style="font-size:11.5px">กรุณากดรับทราบ เพื่อให้ผู้ประกาศทราบ</div></div><button class="x" onclick="closeModal()">×</button></div>
  <div class="pad" id="ackpop">${list.map(a=>`<div class="feed-item" style="align-items:flex-start;border-bottom:1px solid var(--line-2);padding-bottom:10px"><span class="fi" style="background:${u(a.who).c};color:#fff">${u(a.who).s}</span>
    <div style="flex:1"><b style="font-weight:500">${a.pin?'📌 ':''}${a.title}</b><div class="muted" style="font-size:11px">${shortName(a.who)} · ${a.time}</div><div style="font-size:12.5px;margin-top:3px">${a.body}</div>
    <div style="margin-top:7px;display:flex;gap:6px"><button class="tbtn sm primary" onclick="ackAnn('${a.id}')">✓ รับทราบ</button><button class="tbtn sm" onclick="openAnn('${a.id}')">เปิดอ่าน / ตอบกลับ</button></div></div></div>`).join('')}</div>`);
}
function openAnn(id){const a=ANN.find(x=>x.id===id);if(!a)return;const st=annStatus(a);
  const aud=annAudienceIds(a),ack=a.acks||[],pend=aud.filter(x=>!ack.includes(x));

  showModal(`<div class="modal-h"><div><div style="margin-bottom:4px"><span class="pill" style="background:${st.c}">${st.t}</span></div><h3>${a.pin?'📌 ':''}${a.title}</h3>
    <div class="muted" style="font-size:11.5px">${shortName(a.who)} · ${a.time} · 📨 ${a.audience||'ทั้งบริษัท'}${a.from?` · 🗓 มีผล ${fmtDate(a.from)}${a.until?(' – '+fmtDate(a.until)):' (ไม่มีสิ้นสุด)'}`:''}</div></div><button class="x" onclick="closeModal()">×</button></div>

    ${iRecip?(iAck?`<div class="ai-note" style="margin-top:12px">✅ คุณรับทราบประกาศนี้แล้ว</div>`:`<button class="tbtn primary" style="margin-top:12px" onclick="ackAnn('${a.id}')">✓ กดรับทราบ</button>`):`<div class="muted" style="margin-top:12px;font-size:12px">คุณไม่ได้อยู่ในผู้รับของประกาศนี้</div>`}
    <div class="field" style="margin-top:14px"><label>สถานะการรับทราบ — ${ack.length}/${aud.length} คน</label>

      ${canSee?`<div style="font-size:12px"><b style="font-weight:500;color:var(--green)">✓ รับทราบแล้ว:</b> ${ack.map(shortName).join(', ')||'-'}</div>
        <div style="font-size:12px;margin-top:3px"><b style="font-weight:500;color:var(--amber)">⏳ ยังไม่รับทราบ:</b> ${pend.map(shortName).join(', ')||'ครบทุกคนแล้ว 🎉'}</div>`:`<div class="muted" style="font-size:11px">* เฉพาะผู้ประกาศ / หัวหน้า / ผู้บริหาร เห็นรายชื่อ</div>`}
    </div>

      <div style="display:flex;gap:6px;margin-bottom:8px"><input class="fin" id="annCmt_${a.id}" placeholder="เขียนตอบกลับ..." style="flex:1" onkeydown="if(event.key==='Enter')addAnnComment('${a.id}')"><button class="tbtn" title="พูด" onclick="voiceDictate('annCmt_${a.id}')">🎤</button><button class="tbtn primary" onclick="addAnnComment('${a.id}')">ส่ง</button></div>
      ${(a.comments||[]).map(cm=>`<div class="logline"><span class="mini" style="background:${u(cm.who).c}">${u(cm.who).s}</span><div><b style="font-weight:500;font-size:12px">${shortName(cm.who)}</b> <span class="muted" style="font-size:11px">· ${cm.time}</span><div style="font-size:12.5px">${cm.text}</div></div></div>`).join('')||'<div class="muted" style="font-size:12px">ยังไม่มีการตอบกลับ</div>'}
    </div>
  </div>`);
}
function addAnnComment(id){const a=ANN.find(x=>x.id===id);const v=normSp(val('annCmt_'+id));if(!v)return;
  a.comments=a.comments||[];a.comments.push({who:me(),text:v,time:'เมื่อสักครู่'});

const sopForDept=c=>c==='GRAPHIC'?'SOP-GR':('SOP-'+c);

function toast(msg,type='ok'){
  const wrap=document.getElementById('toast');const d=document.createElement('div');
  d.className='toast-item'+(type==='info'?' info':'');d.innerHTML=(type==='info'?'ℹ️ ':'✅ ')+msg;wrap.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),300);},2600);
}
function refresh(){RENDER[VIEW](BOARD_DEPT);if(typeof saveState==='function')saveState();}
function nextTaskId(){return 'T-'+(Math.max(...TASKS.map(t=>+t.id.split('-')[1]))+1);}

function createTask(d){
  const assignees=(d.assignees&&d.assignees.length)?d.assignees:(d.assignee?[d.assignee]:['a']);
  const t={id:nextTaskId(),dept:d.dept,title:normSp(d.title)||'งานใหม่',creator:ROLE_META[ROLE].u,assignee:assignees[0],assignees,
    status:'todo',prio:d.prio||'mid',start:'08-07',due:d.due||'08-12',spent:0,ontime:true,sla:d.sla||null,
    tags:d.tags||[],sop:sopForDept(d.dept),desc:normSp(d.desc),sub:[],log:[{who:ROLE_META[ROLE].u,txt:'สร้างงาน',time:'เมื่อสักครู่'}]};
  TASKS.unshift(t);
  logFeed('🆕','#eef2ff',`<b>${shortName(t.creator)}</b> สร้างงาน <b>${t.id}</b> ${t.title} · มอบ ${assignees.map(shortName).join(', ')}`);
  return t;
}
function setTaskStatus(id,st){const t=TASKS.find(x=>x.id===id);if(!t||t.status===st)return;
  t.status=st;(t.log=t.log||[]).unshift({who:ROLE_META[ROLE].u,txt:'เปลี่ยนสถานะเป็น '+STATUS[st].t,time:'เมื่อสักครู่'});

function setDue(id,v){const t=TASKS.find(x=>x.id===id);if(!v)return;t.due=v.slice(5);if(t.due<t.start)t.start=t.due;t.ontime=(t.due>='08-07');toast('เปลี่ยนกำหนดส่งเป็น '+fmtDate(t.due));refresh();openTask(id);}
function setSpent(id){const t=TASKS.find(x=>x.id===id);t.spent=Math.max(0,parseFloat(val('spent_'+id))||0);toast('บันทึกเวลาที่ใช้ '+t.spent+' ชม.');refresh();openTask(id);}
function addSpent(id,h){const t=TASKS.find(x=>x.id===id);t.spent=Math.round(((t.spent||0)+h)*10)/10;toast('บันทึกเวลา +'+h+' ชม. (รวม '+t.spent+' ชม.)');refresh();openTask(id);}

function addSub(id){
  const name=val('subName').trim(),who=val('subWho');

function saveSolution(id){const t=TASKS.find(x=>x.id===id),sol=val('solIn').trim();
  if(!sol){toast('ยังไม่ได้กรอกวิธีแก้','info');return;}t.solution=sol;saveState();toast('บันทึกวิธีแก้แล้ว');openTask(id);}

  closeModal();refresh();}
function addComment(id){const v=val('cmtIn').trim();if(!v)return;
  const t=TASKS.find(x=>x.id===id);(t.log=t.log||[]).unshift({who:ROLE_META[ROLE].u,txt:v,time:'เมื่อสักครู่'});

function speechOK(){return 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;}

function interpretCommand(txt){

  if(/รอตรวจ|รออนุมัติ/.test(s)){clearAllFilters();F.status='review';go('board');toast('กรองงานรอตรวจ');return;}

/* ===== AI วิเคราะห์คำสั่ง (เก่งขึ้น) ===== */
function addDays(n){const d=new Date(2026,7,7);d.setDate(d.getDate()+n);return ('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function nextWeekday(target){const d=new Date(2026,7,7);let diff=(target-d.getDay()+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff);return ('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function analyzeCommand(raw){
  const s=raw.toLowerCase();
  const dmap=[['GRAPHIC',/แบนเนอร์|ออกแบบ|กราฟิก|โลโก้|วิดีโอ|ภาพ|อาร์ต|โมชั่น/],['CRM',/โทร|ลูกค้า|retention|วินแบ็ก|win-?back|ดูแลลูกค้า|เติมเงิน/],['MKT',/คอนเทนต์|โพสต์|แคมเปญ|การตลาด|โฆษณา|engagement|โปรโมชั่น/],['FIN',/เบิก|โอน|การเงิน|สรุปเดือน|กระทบยอด|เงินสด/],['ADMIN',/แชท|ตอบลูกค้า|เคส|แอดมิน/],['QC',/ตรวจแชท|คุณภาพ|นายหน้า|บัญชีหน้าเว็บ|qc/]];
  let dept='GRAPHIC';for(const[c,re]of dmap){if(re.test(s)){dept=c;break;}}
  let prio='mid';if(/ด่วน|เร่ง|ทันที|วันนี้/.test(s))prio='high';else if(/ไม่เร่ง|เมื่อว่าง|ไม่รีบ/.test(s))prio='low';
  let due=addDays(5);const wd={'อาทิตย์':0,'จันทร์':1,'อังคาร':2,'พุธ':3,'พฤหัส':4,'ศุกร์':5,'เสาร์':6};const mIn=s.match(/ภายใน\s*(\d+)\s*วัน/);
  if(/วันนี้/.test(s))due=addDays(0);else if(/พรุ่งนี้/.test(s))due=addDays(1);else if(/มะรืน/.test(s))due=addDays(2);
  else if(/สัปดาห์หน้า/.test(s))due=addDays(7);else if(/สิ้นเดือน/.test(s))due='08-31';else if(mIn)due=addDays(+mIn[1]);
  else{for(const k in wd){if(s.includes(k)){due=nextWeekday(wd[k]);break;}}}
  let title=normSp(raw.replace(/ส่ง\s*(วันนี้|พรุ่งนี้|มะรืน|สัปดาห์หน้า|สิ้นเดือน|ภายใน\s*\d+\s*วัน)/g,'').replace(/(อาทิตย์|จันทร์|อังคาร|พุธ|พฤหัส|ศุกร์|เสาร์)นี้?/g,'').replace(/ภายใน\s*\d+\s*วัน|ด่วนที่สุด|เร่งด่วน|ด่วน/g,''))||raw;
  const grp=GROUPS.find(g=>g.dept===dept);const members=grp?grp.members:['a'];
  const load=id=>TASKS.filter(t=>assigneesOf(t).includes(id)&&t.status!=='done').length;
  const assignee=members.slice().sort((a,b)=>load(a)-load(b))[0];
  const sop=SOPS.find(x=>x.dept===dept);const checklist=sop?sop.steps.slice(0,4):['ดำเนินการ','ตรวจสอบ','ส่งอนุมัติ'];
  const desc='ดำเนินการ "'+title+'" ตามมาตรฐานแผนก'+deptName(dept)+' พร้อมตรวจสอบความถูกต้องก่อนส่ง';
  const kb=KB.find(k=>k.dept===dept);
  const slaN=Math.max(1,Math.round((DFROM(due)-new Date(2026,7,7))/86400000));
  return {title,dept,prio,due,assignee,checklist,desc,kb,sla:{n:slaN,unit:'day'}};
}

function donut(data,total,centerLabel){
  const R=54,C=2*Math.PI*R;let off=0;const segs=data.filter(d=>d.value>0).map(d=>{
    const frac=d.value/(total||1),len=frac*C,s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${d.color}" stroke-width="20" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s;}).join('');
  return `<svg width="140" height="140" viewBox="0 0 140 140">${segs}
    <text x="70" y="66" text-anchor="middle" font-size="26" font-weight="600" fill="#182338">${total}</text>
    <text x="70" y="86" text-anchor="middle" font-size="11" fill="#67769a">${centerLabel}</text></svg>`;
}

function hbars(rows,unit=''){const max=Math.max(...rows.map(r=>r.v),1);

    <span class="track"><i style="width:${Math.max(r.v/max*100,2)}%;${r.color?`background:${r.color}`:''}"></i></span>
    <span class="num">${nf(r.v)}${unit}</span></div>`).join('');
}
function sparkline(pts,w=260,h=64){
  const max=Math.max(...pts),min=Math.min(...pts)-2,rng=(max-min)||1;
  const step=w/(pts.length-1);
  const xy=pts.map((p,i)=>[i*step,h-((p-min)/rng)*(h-10)-5]);
  const line=xy.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const area=line+` L${w} ${h} L0 ${h} Z`;
  const dots=xy.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="#2158c8"/>`).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2158c8" stop-opacity=".18"/><stop offset="1" stop-color="#2158c8" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#g)"/><path d="${line}" fill="none" stroke="#2158c8" stroke-width="2"/>${dots}</svg>`;
}

function applyFilters(list){
  let r=list.filter(t=>{
    if(F.q){const q=F.q.toLowerCase();if(!(t.title.toLowerCase().includes(q)||t.id.toLowerCase().includes(q)||t.tags.join(' ').toLowerCase().includes(q)))return false;}
    if(F.dept&&t.dept!==F.dept)return false;
    if(F.status&&t.status!==F.status)return false;
    if(F.prio&&t.prio!==F.prio)return false;
    if(F.assignee&&t.assignee!==F.assignee)return false;
    if(F.period==='today'&&t.due!=='08-07')return false;
    if(F.period==='overdue'&&!(t.due<'08-07'&&t.status!=='done'))return false;
    if(F.period==='active'&&t.status==='done')return false;
    if(F.dateFrom&&d2(t.due)<F.dateFrom)return false;
    if(F.dateTo&&d2(t.start)>F.dateTo)return false;
    return true;
  });
  const key=F.sort;
  r.sort((a,b)=>{let x,y;
    if(key==='prio'){const o={high:0,mid:1,low:2};x=o[a.prio];y=o[b.prio];}
    else if(key==='status'){const o=Object.keys(STATUS);x=o.indexOf(a.status);y=o.indexOf(b.status);}
    else if(key==='spent'){x=a.spent;y=b.spent;}
    else {x=a[key];y=b[key];}
    return (x>y?1:x<y?-1:0)*F.dir;});
  return r;
}
function activeFilterChips(){
  const chips=[];
  const add=(k,label,val)=>chips.push(`<button class="fchip"><b>${label}:</b> ${val} <span class="rm" onclick="clearFilter('${k}')">✕</span></button>`);
  if(F.q)add('q','ค้นหา',F.q);
  if(F.dept)add('dept','แผนก',deptName(F.dept));
  if(F.status)add('status','สถานะ',STATUS[F.status].t);
  if(F.prio)add('prio','ความสำคัญ',PRIO[F.prio].t);
  if(F.assignee)add('assignee','ผู้รับผิดชอบ',shortName(F.assignee));
  if(F.period)add('period','ช่วง',{today:'วันนี้',overdue:'เกินกำหนด',active:'ที่ยังไม่เสร็จ'}[F.period]);
  if(F.dateFrom)add('dateFrom','ตั้งแต่',F.dateFrom);
  if(F.dateTo)add('dateTo','ถึง',F.dateTo);
  if(!chips.length)return '';
  return `<div class="chips">${chips.join('')}<button class="fchip" style="background:#fde7ea;color:#b01a30" onclick="clearAllFilters()">ล้างทั้งหมด</button></div>`;
}

function groupedBoards(list){

  list.forEach(t=>{let key=F.group==='dept'?t.dept:F.group==='status'?t.status:t.assignee;(groups[key]=groups[key]||[]).push(t);});
  return Object.keys(groups).map(g=>{
    let label,color;
    if(F.group==='dept'){label=deptName(g);color=deptColor(g);}
    else if(F.group==='status'){label=STATUS[g].t;color=STATUS[g].c;}

}
function boardTableInner(list,showDept=true){

RENDER.timeline=function(){
  const list=applyFilters(TASKS).filter(t=>t.status!=='done');
  const D=s=>new Date(2026,+s.split('-')[0]-1,+s.split('-')[1]);
  const mmdd=dt=>('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2);
  const all=list.flatMap(t=>[t.start,t.due]).filter(Boolean).sort();
  const minS=all[0]||'08-04', maxS=all[all.length-1]||'08-13';
  const sD=D(minS), eD=D(maxS);
  const span=Math.max(Math.round((eD-sD)/86400000)+1,1);
  const idx=s=>Math.round((D(s)-sD)/86400000);
  const step=Math.max(1,Math.ceil(span/12));const ticks=[];
  for(let i=0;i<span;i+=step){const d=new Date(sD);d.setDate(d.getDate()+i);ticks.push(fmtDate(mmdd(d)));}
  main.innerHTML=`${crumb('หน้าแรก','ไทม์ไลน์งาน')}
  <div class="page-h"><div><h1>ไทม์ไลน์งาน</h1><p>ช่วงเวลาดำเนินงานและกำหนดส่ง · ${fmtDate(minS)} – ${fmtDate(maxS)} 2569</p></div></div>
  ${filterBar(false)}${activeFilterChips()}
  ${list.length?`<div class="card pad">
    <div class="tl-scale" style="grid-template-columns:repeat(${ticks.length},1fr)">${ticks.map(d=>`<span>${d}</span>`).join('')}</div>
    ${list.map(t=>{const l=idx(t.start)/span*100,w=Math.max((idx(t.due)-idx(t.start)+1)/span*100,3);
      return `<div class="tl-row"><div style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${deptPill(t.dept)} ${t.title} <span class="muted">· ส่ง ${fmtDate(t.due)}</span></div>
        <div class="tl-track"><div class="tl-bar" style="left:${l}%;width:${w}%;background:${STATUS[t.status].c}" onclick="openTask('${t.id}')" title="${t.title} (${fmtDate(t.start)}→${fmtDate(t.due)})">${t.id}</div></div></div>`;}).join('')}
    <div class="legend" style="margin-top:12px">${Object.keys(STATUS).map(s=>`<span><span class="dot" style="background:${STATUS[s].c}"></span>${STATUS[s].t}</span>`).join('')}</div>
  </div>`:'<div class="card pad" style="text-align:center;color:var(--muted);padding:40px">ไม่มีงานที่กำลังดำเนินการในช่วงนี้</div>'}`;
};

function kpiStatus(pct){return pct>=100?{t:'ดีเยี่ยม',c:'var(--green)',ic:'✓'}:pct>=95?{t:'ดีมาก',c:'var(--green)',ic:'✓'}:pct>=90?{t:'ดี',c:'var(--amber)',ic:'≈'}:pct>=80?{t:'พอใช้',c:'var(--amber)',ic:'≈'}:{t:'ต้องปรับปรุง',c:'var(--red)',ic:'!'};}
function kpiList(c,editable){return KPI[c].map((k,i)=>{const st=kpiStatus(k.pct);const over=k.pct>100;const real=k.tgt!=null;return `
  <div class="kpi-item">
    <span class="kpi-icn" style="background:${st.c}" title="${st.t}">${st.ic}</span>
    <div style="flex:1;min-width:0">
      <div class="kpi-name">${k.n}</div>
      <div class="bar" style="margin:6px 0 4px"><i style="width:${Math.min(k.pct,100)}%;background:${st.c}"></i></div>
      <div class="kpi-val muted">ทำได้ <b style="color:var(--ink)">${acDisp(k)}</b> · เป้า ${k.tg}${real?` · น้ำหนัก ${Math.round(k.w*100)}% · Achievement <b style="color:${st.c}">${k.pct}%</b>`:''}</div>
      ${real&&editable?`<div class="kpi-edit">Actual รายเดือน <input type="number" min="0" max="100" step="0.1" value="${k.ac}" onchange="setKpiActual('${c}',${i},this.value)"> % <span class="muted">แก้แล้วคำนวณคะแนนใหม่ให้อัตโนมัติ</span></div>`:''}
    </div>
    <span class="pill" style="background:${st.c};margin-top:2px">${st.t}${over?' ▲':''}</span>
  </div>`;}).join('');}
/* แก้ค่า Actual รายเดือน → คำนวณใหม่ + บันทึก */
function setKpiActual(c,i,v){let n=parseFloat(v);if(isNaN(n))return;n=Math.max(0,Math.min(100,n));KPI[c][i].ac=n;KPI[c][i].pct=kpiAch(KPI[c][i]);saveState();refresh();toast('อัปเดต '+deptName(c)+' — คำนวณคะแนนใหม่แล้ว');}

const gyrScore=s=>{const g=s>=90?['Green','var(--green)']:s>=75?['Yellow','var(--amber)']:['Red','var(--red)'];return '<span class="gyr" style="background:'+g[1]+'">'+g[0]+'</span>';};
const gyrKpi=pc=>{const g=pc>=100?['Green','var(--green)']:pc>=85?['Yellow','var(--amber)']:['Red','var(--red)'];return '<span class="gyr" style="background:'+g[1]+'">'+g[0]+'</span>';};
function mKpiRows(d,exp){return d.company
  ? d.codes.map(c=>{const s=deptScore(c);const g=s>=95?'Green':s>=80?'Yellow':'Red';return `<tr><td>${deptName(c)}</td><td>—</td><td>${s}/100</td><td>${exp?g:gyrScore(s)}</td><td>${scoreLabel(s)}</td></tr>`;}).join('')
  : (KPI[d.dept]?KPI[d.dept].map(k=>{const g=k.pct>=95?'Green':k.pct>=80?'Yellow':'Red';return `<tr><td>${k.n}</td><td>${k.tg}</td><td>${acDisp(k)}</td><td>${exp?g:gyrKpi(k.pct)}</td><td>${kpiStatus(k.pct).t}</td></tr>`;}).join(''):'<tr><td colspan="5">—</td></tr>');}
function mMile(d){return d.done.length?d.done.map((t,i)=>`<tr><td>${i+1}</td><td>${t.title}</td><td>${t.solution?t.solution.slice(0,70):'สำเร็จตามเป้า'}</td><td>เสร็จ</td></tr>`).join(''):'<tr><td colspan="4">—</td></tr>';}
function mProb(d){const rows=[...d.blocked,...d.overdue.filter(t=>t.status!=='block')];return rows.length?rows.map((t,i)=>`<tr><td>${i+1}</td><td>${t.title}</td><td>${t.desc?t.desc.slice(0,55):'อยู่ระหว่างวิเคราะห์'}</td><td>${t.prio==='high'?'สูง':'ปานกลาง'}</td><td>${t.status==='block'?'Red':'Yellow'}</td></tr>`).join(''):'<tr><td colspan="5">ไม่มี</td></tr>';}
function mAct(d){return d.open.length?d.open.slice(0,10).map((t,i)=>`<tr><td>${i+1}</td><td>${t.title}</td><td>${assigneesOf(t).map(shortName).join(', ')}</td><td>${fmtDate(t.due)}</td><td>${STATUS[t.status].t}</td></tr>`).join(''):'<tr><td colspan="5">—</td></tr>';}
function mNext(d){const r=d.scope.filter(t=>t.status==='todo').slice(0,5);return r.length?r.map((t,i)=>`<tr><td>${i+1}</td><td>${t.title}</td><td>${shortName(t.assignee)}</td><td>${fmtDate(t.due)}</td></tr>`).join(''):'<tr><td colspan="4">กำหนดในที่ประชุม</td></tr>';}

function downloadBlob(content,name,mime){const blob=new Blob(['﻿'+content],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('ส่งออกไฟล์ '+name+' แล้ว');}

/* ===== Action Tracker (สะสมข้ามเดือน) ===== */
function trackerStatus(t){if(t.status==='done')return['Completed','var(--green)'];if(t.status==='block'||(t.due<'08-07'&&t.status!=='done'))return['Red','var(--red)'];if(t.status==='review'||t.status==='todo')return['Yellow','var(--amber)'];return['Green','var(--sky)'];}
function trackerBase(month){return month==='09'?TASKS.filter(t=>CARRIED.includes(t.id)):TASKS;}
function trackerRows(month){return trackerBase(month).filter(t=>(!TRACK_GROUP||deptGroup(t.dept)===TRACK_GROUP)&&(!TRACK_DEPT||t.dept===TRACK_DEPT)&&(!TRACK_LEVEL||assigneesOf(t).some(a=>userLevel(a)===TRACK_LEVEL)));}
function daysOver(t){if(t.status==='done'||t.due>=TODAY_MMDD)return 0;return Math.round((DFROM(TODAY_MMDD)-DFROM(t.due))/86400000);}
function carryOver(){const open=trackerBase('08').filter(t=>t.status!=='done');let n=0;open.forEach(t=>{if(!CARRIED.includes(t.id)){CARRIED.push(t.id);n++;}});saveState();toast('ยกงานค้าง '+n+' รายการ ไปเดือน ก.ย. 2569');TRACK_MONTH='09';RENDER.tracker();}

function ask(q){
  if(!q||!q.trim())return;
  const body=document.getElementById('chatBody'),inp=document.getElementById('chatInput');if(inp)inp.value='';
  body.insertAdjacentHTML('beforeend',`<div class="msg u">${q}</div>`);
  let ans='';
  if(/kpi|เท่าไหร่|แผนก/.test(q)){
    ans=`<b>คะแนน KPI รายแผนก (เดือนนี้)</b><span class="q">SELECT dept, AVG(score) FROM kpi_records WHERE month='2026-08' GROUP BY dept</span>
      <table class="datatable" style="width:100%"><tr><th>แผนก</th><th>คะแนน</th></tr>
      ${Object.keys(KPI).map(c=>`<tr><td>${deptName(c)}</td><td style="color:${scoreColor(deptScore(c))}">${deptScore(c)}/100</td></tr>`).join('')}</table>`;
  }else if(/ติดปัญหา|block|ค้าง/.test(q)){
    const b=TASKS.filter(t=>t.status==='block'||t.status==='review');
    ans=`<b>งานที่ต้องจับตา (ติดปัญหา/รอตรวจ) มี ${b.length} งาน</b><span class="q">SELECT * FROM tasks WHERE status IN ('block','review')</span>
      ${b.map(t=>`• <b>${t.id}</b> ${t.title} — ${STATUS[t.status].t} (${deptName(t.dept)})`).join('<br>')}`;
  }else if(/ตรงเวลา|กราฟิก|graphic/.test(q)){
    ans=`แผนกกราฟิกส่งงานตรงเวลา <b style="color:var(--amber)">84%</b> (เป้า ≥90%) ต่ำกว่าเป้าเล็กน้อย<span class="q">SELECT on_time_rate FROM kpi WHERE dept='GRAPHIC'</span>สาเหตุหลักจากงานเร่งแทรกและแก้หลายรอบ — มีวิธีลดใน KB-05`;
  }else{ans=`พบข้อมูลที่เกี่ยวข้องในระบบ ${TASKS.length} งาน และ ${KB.length} บทความความรู้<span class="q">SELECT ... FROM internal_db /* ข้อมูลภายในเท่านั้น */</span>ลองถามเจาะจง เช่น "งานของ CRM วันนี้"`;}
  setTimeout(()=>{body.insertAdjacentHTML('beforeend',`<div class="msg a">${ans}</div>`);body.scrollTop=body.scrollHeight;},250);
  body.scrollTop=body.scrollHeight;
}

function openTask(id){
  const t=TASKS.find(x=>x.id===id);if(!t)return;const sop=SOPS.find(s=>s.id===t.sop);
  const sSel=`<div class="statusbtns">${Object.keys(STATUS).map(s=>`<button class="stbtn ${t.status===s?'active':''}" style="--c:${STATUS[s].c}" onclick="setTaskStatus('${t.id}','${s}')">${t.status===s?'● ':''}${STATUS[s].t}</button>`).join('')}</div>`;
  const aBox=`<div style="display:flex;align-items:center;gap:8px;padding-top:4px">${avStack(assigneesOf(t))}<span style="font-size:12.5px">${assigneesOf(t).map(shortName).join(', ')}</span><button class="tbtn sm" style="margin-left:auto" onclick="openAssigneePicker('${t.id}')">แก้ / เพิ่มคน</button></div>`;
  const pSel=`<div class="statusbtns">${Object.keys(PRIO).map(pk=>`<button class="stbtn ${t.prio===pk?'active':''}" style="--c:${PRIO[pk].c}" onclick="setPrio('${t.id}','${pk}')">${PRIO[pk].t}</button>`).join('')}</div>`;
  const _D=s=>new Date(2026,+s.split('-')[0]-1,+s.split('-')[1]);
  const dl=Math.round((_D(t.due)-new Date(2026,7,7))/86400000);
  const dueNote=t.status==='done'?'ปิดงานแล้ว':dl>0?('เหลืออีก '+dl+' วัน'):dl===0?'ครบกำหนดวันนี้':('เกินกำหนด '+(-dl)+' วัน');
  const dueColor=t.status==='done'?'var(--green)':dl<0?'var(--red)':dl===0?'var(--amber)':'var(--muted)';
  const _sla=slaOf(t);
  const _slaNote=_sla.unit==='day'?`นับจากวันเริ่ม ${fmtDate(t.start)} ควรเสร็จภายใน ${fmtDate(addFrom(t.start,_sla.n))}`+(addFrom(t.start,_sla.n)>t.due?' · กระชั้นกว่ากำหนดส่ง':''):`ต้องเสร็จภายใน ${_sla.n} ชั่วโมงหลังเริ่มงาน`;
  showModal(`<div class="modal-h"><div><div style="margin-bottom:6px">${deptPill(t.dept)} ${statusPill(t.status)} ${prioPill(t.prio)}</div>
    <h3>${t.title}</h3><div class="muted" style="font-size:11.5px">${t.id} · สั่งโดย ${shortName(t.creator)}</div></div><button class="x" onclick="closeModal()">×</button></div>
  <div class="pad">
    <div class="field"><label>รายละเอียดงาน</label><div class="v">${t.desc||'-'}</div></div>
    <div class="field" style="margin-top:6px"><label>สถานะ (คลิกเพื่อเปลี่ยน)</label>${sSel}</div>
    <div class="field"><label>ความสำคัญ</label>${pSel}</div>
    <div class="field"><label>ผู้รับผิดชอบ (${assigneesOf(t).length} คน)</label>${aBox}</div>
    <div class="two">
      <div class="field"><label>กำหนดส่ง</label>
        <input type="date" class="fin" value="2026-${t.due}" onchange="setDue('${t.id}',this.value)">
        <div style="font-size:11px;margin-top:4px;color:${dueColor}">เริ่ม ${fmtDate(t.start)} · ${dueNote}</div></div>
      <div class="field"><label>เวลาที่ใช้ (ชม.)</label>
        <div style="display:flex;gap:6px;align-items:center">
          <input type="number" min="0" step="0.5" class="fin" id="spent_${t.id}" value="${t.spent||0}" style="max-width:90px">
          <button class="tbtn sm" onclick="setSpent('${t.id}')">บันทึก</button>
          <button class="tbtn sm" onclick="addSpent('${t.id}',1)">+1 ชม.</button></div></div>
    </div>
    <div class="field"><label>ระยะเวลาดำเนินการที่กำหนด (SLA)</label>
      <div style="display:flex;gap:6px;align-items:center">
        <input type="number" min="1" class="fin" id="sla_n_${t.id}" value="${_sla.n}" style="max-width:80px">
        <select class="fin" id="sla_u_${t.id}" style="max-width:110px"><option value="day" ${_sla.unit==='day'?'selected':''}>วัน</option><option value="hr" ${_sla.unit==='hr'?'selected':''}>ชั่วโมง</option></select>
        <button class="tbtn sm" onclick="setSla('${t.id}')">บันทึก</button></div>
      <div class="muted" style="font-size:11px;margin-top:4px">${_slaNote}</div></div>

    <div class="field"><label>งานย่อย / มอบต่อ (Delegation) — คลิกเพื่อเปลี่ยนสถานะงานย่อย</label>
      ${(t.sub||[]).map((s,i)=>`<div class="sub-item" onclick="toggleSub('${t.id}',${i})" title="คลิกเพื่อเปลี่ยนสถานะ"><span class="mini" style="background:${u(s.who).c}">${u(s.who).s}</span><div style="flex:1">${s.t} <span class="muted" style="font-size:11px">· ${shortName(s.who)}</span></div>${statusPill(s.st)}<span class="cyc">↻ เปลี่ยน</span></div>`).join('')||'<div class="muted" style="font-size:12px">ยังไม่มีงานย่อย</div>'}

    ${sop?`<div class="field"><label>SOP ที่ผูกกับงานนี้ — ${sop.title}</label>
      ${sop.steps.slice(0,4).map((s,i)=>`<div class="step"><span class="n">${i+1}</span>${s}</div>`).join('')}
      <a style="font-size:11.5px;color:var(--blue-700);cursor:pointer" onclick="openSOP('${sop.id}')">ดู SOP เต็ม →</a></div>`:''}

    ${t.solution?`<div class="field"><label>✅ วิธีแก้ปัญหา (บันทึกลงคลังความรู้แล้ว)</label><div class="ai-note">${t.solution}</div></div>`:
      `<div class="field"><label>วิธีแก้ปัญหา / ผลการดำเนินงาน</label><textarea id="solIn" rows="2" placeholder="พิมพ์วิธีแก้ แล้วกด 'อนุมัติ/ปิดงาน' → ระบบเก็บเข้าคลังความรู้อัตโนมัติ"></textarea></div>`}
    <div style="display:flex;gap:8px;margin-top:2px;flex-wrap:wrap">
      ${!t.solution?`<button class="tbtn" onclick="saveSolution('${t.id}')">💾 บันทึกวิธีแก้</button>`:''}
      ${ROLE!=='staff'&&t.status!=='done'?`<button class="tbtn primary" style="background:var(--green);border-color:var(--green)" onclick="closeTaskWithSolution('${t.id}')">✓ อนุมัติ/ปิดงาน</button>`:''}
      ${t.status==='done'?`<button class="tbtn" onclick="setTaskStatus('${t.id}','doing')">↩ เปิดงานใหม่</button>`:''}</div>

    <div class="field" style="margin-top:14px"><label>ความเคลื่อนไหว / ความคิดเห็น</label>
      <div style="display:flex;gap:6px;margin-bottom:8px"><input class="fin" id="cmtIn" placeholder="เขียนความคิดเห็น..." style="flex:1" onkeydown="if(event.key==='Enter')addComment('${t.id}')"><button class="tbtn" onclick="addComment('${t.id}')">ส่ง</button></div>
      ${(t.log||[]).map(l=>`<div class="logline"><span class="mini" style="background:${u(l.who).c}">${u(l.who).s}</span><div><b style="font-weight:500;font-size:12px">${shortName(l.who)}</b> <span class="muted" style="font-size:11px">· ${l.time}</span><div style="font-size:12px">${l.txt}</div></div></div>`).join('')||'<div class="muted" style="font-size:12px">ยังไม่มีความเคลื่อนไหว</div>'}</div>
  </div>`);
}
function openDoc(id){const d=DOCS.find(x=>x.id===id);if(!d)return;
  showModal(`<div class="modal-h"><div><span class="pill" style="background:var(--blue-800)">ระเบียบ · ${d.rev}</span><h3 style="margin-top:6px">${d.title}</h3><div class="muted" style="font-size:11.5px">${d.en} · หน่วยงานเจ้าของ: ${d.owner}</div></div><button class="x" onclick="closeModal()">×</button></div>
  <div class="pad">${d.sections.map(s=>`<div class="field"><label style="font-size:12.5px;color:var(--blue-700);font-weight:500">${s.h}</label>${s.items.map(it=>`<div class="step"><span style="color:var(--blue-500);font-weight:700">•</span><div style="flex:1">${it}</div></div>`).join('')}</div>`).join('')}
  <div class="ai-note">📎 เอกสารต้นฉบับ: <b>ระเบียบการประชุมติดตามผลประจำเดือน.pdf</b> — เก็บใน โฟลเดอร์ บริษัท/รายงานเพิ่มเติม/08.08.2026</div></div>`);}
function openSOP(id){
  const s=SOPS.find(x=>x.id===id);if(!s)return;
  showModal(`<div class="modal-h"><div><div style="margin-bottom:6px">${deptPill(s.dept)}</div><h3>${s.title}</h3>
    <div class="muted" style="font-size:11.5px">เวอร์ชัน ${s.v} · อนุมัติแล้ว</div></div><button class="x" onclick="closeModal()">×</button></div>
    <div class="pad"><div class="field"><label>ขั้นตอนการทำงาน (Workflow)</label>
    ${s.steps.map((st,i)=>`<div class="step"><span class="n">${i+1}</span>${st}</div>`).join('')}</div>
    <div class="ai-note">🤖 <b>AI:</b> ผูก SOP นี้กับงานอัตโนมัติได้ เมื่อเปิดงานในแผนก ${deptName(s.dept)} ระบบจะแสดงขั้นตอนนี้ และนับการปฏิบัติตาม SOP เป็นส่วนหนึ่งของ KPI</div></div>`);
}
function openKB(id){
  const k=KB.find(x=>x.id===id);if(!k)return;
  showModal(`<div class="modal-h"><div><div style="margin-bottom:6px">${deptPill(k.dept)}</div><h3>${k.title}</h3>
    <div class="muted" style="font-size:11.5px">${k.id} · สร้างจากงาน ${k.from}</div></div><button class="x" onclick="closeModal()">×</button></div>
    <div class="pad"><div class="field"><label>ปัญหา</label><div class="v">${k.problem}</div></div>
    <div class="field"><label>✅ วิธีแก้</label><div class="ai-note">${k.solution}</div></div>
    <div class="field"><label>แท็ก</label>${k.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div></div>`);
}
function openCompose(){
  const defDept=ROLE==='exec'?'GRAPHIC':ROLE_META[ROLE].dept;
  showModal(`<div class="modal-h"><div><h3>✨ สร้างงานด้วย AI</h3><div class="muted" style="font-size:11.5px">พิมพ์สั้น ๆ AI จะจัดรูปให้อ่านง่าย แล้วกดสร้าง</div></div><button class="x" onclick="closeModal()">×</button></div>
  <div class="pad">
    <div class="field"><label>สั่งงานแบบสั้น (พิมพ์หรือพูดก็ได้)</label><textarea id="cmpIn" rows="2">ทำแบนเนอร์โปรฯ ฝากครั้งแรกให้ 3XBET ส่งศุกร์นี้</textarea></div>
    <div style="display:flex;gap:8px"><button class="tbtn" onclick="voiceDictate('cmpIn')">🎤 พูดใส่</button><button class="tbtn primary" onclick="aiCompose('${defDept}')">🤖 ให้ AI จัดรูปงาน</button></div>
    <div id="cmpOut" style="margin-top:14px"></div></div>`);
}
function aiCompose(defDept){
  const raw=normSp(val('cmpIn'))||'งานใหม่';
  const a=analyzeCommand(raw); if(defDept&&!/แบนเนอร์|ออกแบบ|โทร|คอนเทนต์|เบิก|แชท|ตรวจ/.test(raw.toLowerCase()))a.dept=defDept;
  PICK=new Set([a.assignee]);
  document.getElementById('cmpOut').innerHTML=`
    <div class="ai-note"><b>🤖 AI วิเคราะห์ให้แล้ว:</b> แผนก <b>${deptName(a.dept)}</b> · ความสำคัญ <b>${PRIO[a.prio].t}</b> · กำหนดส่ง <b>${fmtDate(a.due)}</b> · แนะนำ <b>${shortName(a.assignee)}</b> (ว่างสุดในทีม)</div>
    <div class="two" style="margin-top:12px">
      <div class="field"><label>หัวข้องาน</label><input class="fin" id="f_title" value="${a.title}"></div>
      <div class="field"><label>แผนก</label><select class="fin" id="f_dept">${deptOptions(a.dept)}</select></div></div>
    <div class="field"><label>รายละเอียด</label><textarea class="fin" id="f_desc" rows="2">${a.desc}</textarea></div>
    <div class="two">
      <div class="field"><label>ความสำคัญ</label><select class="fin" id="f_prio">${Object.keys(PRIO).map(pk=>`<option value="${pk}" ${a.prio===pk?'selected':''}>${PRIO[pk].t}</option>`).join('')}</select></div>
      <div class="field"><label>กำหนดส่ง</label><input type="date" class="fin" id="f_due" value="2026-${a.due}"></div></div>
    <div class="field"><label>ระยะเวลาดำเนินการ (SLA) — ต้องเสร็จภายใน</label><div style="display:flex;gap:6px"><input type="number" min="1" class="fin" id="f_sla_n" value="${a.sla.n}" style="max-width:90px"><select class="fin" id="f_sla_u" style="max-width:120px"><option value="day">วัน</option><option value="hr">ชั่วโมง</option></select></div></div>
    <div class="field"><label>ผู้รับผิดชอบ — เลือกได้หลายคน หรือกดทั้งกลุ่ม</label><div id="pickerBox"></div></div>
    <div class="field"><label>Checklist (AI แตกจาก SOP ${deptName(a.dept)})</label>${a.checklist.map((c,i)=>`<div class="step"><span class="n">${i+1}</span>${c}</div>`).join('')}</div>
    ${a.kb?`<div class="ai-note">🔗 เกี่ยวข้อง: SOP ${deptName(a.dept)} · บทความ ${a.kb.id} (${a.kb.title})</div>`:''}
    <button class="tbtn primary" style="margin-top:12px" onclick="submitCompose()">✓ สร้างงานนี้</button>`;
  renderPicker();
}
function submitCompose(){
  const title=normSp(val('f_title'));if(!title){toast('กรุณาระบุหัวข้องาน','info');return;}
  if(!PICK.size){toast('กรุณาเลือกผู้รับผิดชอบอย่างน้อย 1 คน','info');return;}
  const due=(val('f_due')||'').slice(5)||'08-12';const assignees=[...PICK];
  const sla={n:Math.max(1,parseInt(val('f_sla_n'))||1),unit:val('f_sla_u')||'day'};
  const t=createTask({title,dept:val('f_dept'),assignees,prio:val('f_prio'),due,sla,desc:val('f_desc'),tags:['งานใหม่']});
  closeModal();F.dept='';go('board');toast('สร้างงาน '+t.id+' ให้ '+assignees.length+' คน (ส่ง '+fmtDate(due)+')');
}

/* ===== Persistence (localStorage) ===== */
const LS_KEY='companyhub_state_v1';
/* KPI Actual รายเดือน (เฉพาะทีมที่มี Target) */
function kpiActuals(){const o={};Object.keys(KPI).forEach(c=>{if(KPI[c].some(k=>k.tgt!=null))o[c]=KPI[c].map(k=>k.tgt!=null?k.ac:null);});return o;}
function applyKpiActuals(o){if(!o)return;Object.keys(o).forEach(c=>{if(KPI[c])o[c].forEach((v,i)=>{if(v!=null&&KPI[c][i]&&KPI[c][i].tgt!=null)KPI[c][i].ac=v;});});}
function saveState(){try{localStorage.setItem(LS_KEY,JSON.stringify({TASKS,KB,ANN,GROUPS,ANN_SEQ,REPORT_EDITS,CARRIED,KPI_ACT:kpiActuals()}));}catch(e){}}
function loadState(){try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(!s)return;
  if(s.TASKS){TASKS.length=0;TASKS.push(...s.TASKS);}if(s.KB){KB.length=0;KB.push(...s.KB);}
  if(s.ANN){ANN.length=0;ANN.push(...s.ANN);}if(s.GROUPS){GROUPS.length=0;GROUPS.push(...s.GROUPS);}
  if(typeof s.ANN_SEQ==='number')ANN_SEQ=s.ANN_SEQ;if(s.REPORT_EDITS)REPORT_EDITS=s.REPORT_EDITS;if(Array.isArray(s.CARRIED))CARRIED=s.CARRIED;
  applyKpiActuals(s.KPI_ACT);}catch(e){}}
function resetDemo(){try{localStorage.removeItem(LS_KEY);}catch(e){}location.reload();}

/* ===== Theme ===== */
function applyTheme(d){document.body.classList.toggle('dark',d);const b=document.getElementById('themeBtn');if(b)b.textContent=d?'☀️':'🌙';}
function toggleTheme(){const d=!document.body.classList.contains('dark');applyTheme(d);try{localStorage.setItem('ch_theme',d?'dark':'light');}catch(e){}}

/* ===== INIT ===== */
loadState();
recalcKPI();
try{applyTheme(localStorage.getItem('ch_theme')==='dark');}catch(e){}
setRole('lead');
document.querySelectorAll('#roleSwitch button').forEach(b=>b.onclick=()=>setRole(b.dataset.role));
</script>
