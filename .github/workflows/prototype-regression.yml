name: Prototype regression checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  critical-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify critical modules and JavaScript
        run: node scripts/check-prototype-regressions.mjs

      - name: Verify native intake behavior
        run: node scripts/check-native-entry.mjs

      - name: Verify KPI evidence entry
        run: node scripts/check-kpi-work.mjs

      - name: Verify account authentication boundaries
        run: node scripts/check-company-accounts.mjs

      - name: Install isolated test dependencies
        run: npm install --prefix /tmp/company-hub-tests --no-save happy-dom@20.14.0 @electric-sql/pglite@0.5.8

      - name: Verify report dates, export and data loading
        run: DOM_MODULE=/tmp/company-hub-tests/node_modules/happy-dom/lib/index.js node scripts/check-reporting-integrity.mjs

      - name: Verify report persistence, permissions and KPI approval
        run: PGLITE_MODULE=/tmp/company-hub-tests/node_modules/@electric-sql/pglite/dist/index.js node scripts/check-reporting-integrity-db.mjs
